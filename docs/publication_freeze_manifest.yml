known_gaps:
- id: pride_dry_run_semantics
  severity: warn
  classification: documented tooling limitation
  summary: Of the nine export steps, only 08_export_manuscript_figures.R and 09_export_source_data.R
    implement a side-effect-free dry-run guard. RUN_EXPORT.R restricts the step list
    under --dry-run so the orchestrator is safe, but the remaining seven steps remain
    individually unguarded and would write if invoked directly with --dry-run.
  reference: analysis/09_publication_exports/RUN_EXPORT.R
  action_in_this_task: documented only; not fixed
- id: processed_package_wildcard_glob_filter
  severity: warn
  classification: latent defect, currently masked
  summary: 'R/utilities/export_helpers.R:658, inside processed_files_for_dataset() (defined
    at line 610), filters config$supplementary_table_globs with grepl("\\*", g, fixed
    = TRUE). Under fixed = TRUE that searches for a literal backslash-star, which
    none of the six configured globs contains, so the wildcard arm never fires and
    the filter degenerates to grepl(dataset, g, fixed = TRUE): it keeps 1 of 6 globs
    for microglia and 0 of 6 for neuron_soma and neuron_neuropil, where the intended
    test would keep 6 of 6.'
  correction_to_prior_description: 'Verified against the code, three details of the
    previously circulated description are wrong. (a) The defect is in R/utilities/export_helpers.R,
    not analysis/09_publication_exports/04_make_supplementary_tables.R. (b) It affects the
    PRIDE processed-data package selection consumed by 03_export_processed_pg_matrix_package.R:69
    and 05_make_pride_manifest.R:28; the supplementary-table export itself calls supplementary_candidate_files(),
    which applies no wildcard filter and is unaffected. (c) It is masked by the include_derived
    argument, which both callers pass as cli$include_derived_results == has("--include-derived-results")
    and is therefore FALSE unless that flag is given; the manifest.default_include_derived_results:
    false config key documents the same intent but does not gate this code path.'
  reference: R/utilities/export_helpers.R:658 (processed_files_for_dataset)
  action_in_this_task: documented only; not fixed

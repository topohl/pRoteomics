  freeze_revision_reason: 'Publication-selection correction, not scientific-result
    drift. The superseded manifest pinned an export that included 50 figures from
    the failed WGCNA run microglia_failed_20260720_133211, whose dataset-scope
    segment was never validated by the recursive figure scan. That run is
    FAILED_RUN_PROVENANCE and must never be a publication candidate. The exporter
    now applies drop_noncanonical_wgcna_dataset_scopes(), an exact path-segment
    test over both the historical 06_modules_WGCNA tree and the normalized
    results/wgcna tree, and retires targets it previously wrote but no longer
    selects. Rows removed: 50, all carrying that exact scope segment; unexpected
    canonical removals: 0; all 5201 previously selected canonical rows retained.
    The regenerated export additionally picked up 43 curated extended-data figures
    created after the superseded manifest was written, and refreshed 4 retained
    extended_data_09 files to their current source bytes; both are consequences of
    rerunning a deterministic exporter against a figure tree that had moved on,
    and every affected destination is byte-identical to its current source. No
    WGCNA analysis was rerun and no historical source figure was modified.'

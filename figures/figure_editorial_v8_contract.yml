# Editorial v8: final editorial polish and vector export freeze.
#
# The scientific architecture is FIXED as of Part 23. Nothing here reopens
# differential abundance, GSEA inference, WGCNA, spatial networks, robustness
# definitions, feature selection, biological interpretation or panel
# membership. This layer changes only how the settled evidence is drawn.
#
# Canonical and Parts 16-23 are frozen. Outputs live under
# results/**/manuscript_candidates/editorial_v8/**.
#
# Four rules govern this layer and are enforced by the build and its tests:
#   1. FONT FLOOR. No text below 5 pt at final size.
#   2. MAIN/ED HIERARCHY. A main panel and an Extended Data panel must never be
#      the same graphic at two sizes. Main = concise and story-driving.
#      ED = complete audit, more information, not merely more millimetres.
#   3. ONE SCALE PER QUANTITY. Where the same quantity is plotted in more than
#      one panel it carries one shared symmetric scale and one colour bar.
#   4. VECTOR EXPORT. The delivered PDF must contain embedded fonts and real
#      text-showing operators and must contain no page-sized raster.
#
# Every spatial panel uses config/manuscript_spatial_order.yml: neuropil carries
# region x layer, soma and the microglia-enriched ROI are region-level only.

contract_version: manuscript_editorial_v8_figures_v1
status: candidate_only_not_promoted
palette: config/manuscript_palette.yml
spatial_order: config/manuscript_spatial_order.yml
font_floor_pt: 5

panels:

  # ===================== FIGURE 2 =========================================
  - id: v8_schematic
    renderer: e8_schematic
    role: experimental_anatomy_anchor
    spatial_axes: compartment+region+layer
    phenotype_axes: none_intentional
    main_or_ed: main_unique
    narrative: >-
      teaches the spatial grammar: compartment by glyph style, region by the
      same accent and boundary system used in the fingerprint headers, layer by
      anatomical position with explicit short labels. A reader should be able to
      find a location here and locate the matching block in panel d.
    primary_source: null

  - id: v8_depth
    renderer: e8_depth_compact
    role: technical_context
    spatial_axes: compartment
    phenotype_axes: none_intentional
    main_or_ed: main_concise
    narrative: all three compartments have sufficient coverage for spatial comparison.
    primary_source: results/source_data/manuscript/figure_02/figure_02b_source_data.csv

  - id: v8_pca
    renderer: nf_pca_compact
    role: global_structure
    spatial_axes: compartment+region
    phenotype_axes: none_intentional
    main_or_ed: main_unique
    narrative: >-
      the global proteome is broadly organised before any specific spatial
      signature is inspected. Simplified for the main figure: no sample labels,
      deterministic legend order, compartment encoded clearly, no empty legend
      block and no boundary clipping.
    primary_source: results/source_data/manuscript/figure_02/figure_02c_source_data.csv
    input_dependencies:
      - results/tables/03_qc_exploration/00b_joint_compartment_qc/global/joint_primary_pca_variance_explained.csv

  - id: v8_fingerprint
    renderer: e8_fingerprint
    role: direct_baseline_spatial_molecular_view
    spatial_axes: compartment+region+layer
    phenotype_axes: none_intentional
    main_or_ed: main_concise
    narrative: >-
      the largest panel in Figure 2. Phenotype-blind genes selected only by
      prespecified CON-only anatomical contrasts, shown as within-protein
      standardised CON abundance across every spatial unit.
    primary_source: results/tables/manuscript_candidates/spatial_v6/figure2_spatial_fingerprint_proteins.csv

  - id: v8_compartment
    renderer: e8_compartment
    role: compartment_identity
    spatial_axes: compartment
    phenotype_axes: none_intentional
    main_or_ed: main_concise
    narrative: >-
      neuropil, neuronal soma and the microglia-enriched ROI carry distinct
      expected molecular identities. Given real width so the marker names and
      the compartment labels fit inside the panel.
    primary_source: results/source_data/03_qc_exploration/04e_control_compartment_abundance_publication_figures/global/figure2d_compact_recognizable_markers_v2_source_data.csv

  - id: v8_bilateral_main
    renderer: nf_bilateral_main
    role: reproducibility
    spatial_axes: compartment+region+layer
    phenotype_axes: none_intentional
    main_or_ed: main_concise
    narrative: >-
      one representative left-versus-right scatter plus a compact summary over
      all prespecified contrasts, blocked into REGIONAL then FINE/LAMINAR
      identity. The weaker fine CA1 laminar result is deliberately kept visible.
      The complete metric inventory lives in ED1, not here.
    primary_source: results/tables/11_spatial_systems/bilateral/bilateral_spatial_identity_protein_level.csv
    input_dependencies:
      - results/tables/11_spatial_systems/bilateral/bilateral_spatial_identity_summary.csv

  - id: v8_external_main
    renderer: e8_external_main
    role: external_validation
    spatial_axes: region+layer
    phenotype_axes: none_intentional
    main_or_ed: main_concise
    narrative: >-
      do internally observed spatial identities agree with an external
      hippocampal reference? Story-driving expected pairings only, blocked by
      anatomical level. The complete specificity inventory lives in ED2.
    primary_source: results/source_data/04_differential_expression_enrichment/control_spatial_identity_validation/global/figure2e_source_data.csv

  - id: v8_internal_main
    renderer: e8_internal_main
    role: internal_validation
    spatial_axes: region+layer
    phenotype_axes: none_intentional
    main_or_ed: main_concise
    narrative: >-
      do measured anatomical differences correspond to coherent biological
      programs? Selected canonical contrasts only; the complete anatomical
      program evidence lives in ED2.
    primary_source: results/source_data/04_differential_expression_enrichment/control_spatial_identity_validation/global/figure2f_regions_CA1layers_source_data.csv

  # ===================== FIGURE 3 =========================================
  - id: v8_dap_track
    renderer: e8_dap_track
    role: sparse_single_protein_da
    spatial_axes: compartment+region+layer
    phenotype_axes: SUS-RES
    main_or_ed: main_unique
    narrative: >-
      the premise the figure rests on: individual-protein differential abundance
      is sparse. Two numeric rows aligned column-for-column with the atlas below
      it: canonical FDR-supported SUS-RES count, and the robustness-qualified
      count. Numeric rather than bars so the CA2-SLM canonical value cannot
      dominate the panel.
    primary_source: results/tables/11_spatial_systems/atlas/protein_spatial_cell_affinity.csv

  - id: v8_atlas
    renderer: e8_gsea_atlas
    role: program_atlas
    contrast: SUS - RES
    spatial_axes: compartment+region+layer
    phenotype_axes: SUS-RES
    main_or_ed: main_concise
    narrative: >-
      the central quantitative panel. Claim-eligible themes only; the two
      qc_review themes are excluded. Shares its column geometry exactly with the
      DAP track above so the two read as one block.
    primary_source: results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv

  - id: v8_bridge
    renderer: e8_anatomy_bridge
    role: anatomical_program_bridge
    spatial_axes: compartment+region+layer
    phenotype_axes: RES-CON+SUS-CON+SUS-RES
    main_or_ed: main_unique
    narrative: >-
      ONE shared hippocampal schematic with three anchored callouts, replacing
      three repeated miniature maps. Each callout carries a compact
      three-contrast strip. Wording stays conservative: the two exemplars whose
      RES-CON arm is not FDR-supported are called susceptibility-associated,
      never divergent.
    primary_source: results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv

  - id: v8_curve_syn
    renderer: e8_gsea_curve
    role: direct_evidence
    column_index: "1"
    program_key: synaptic
    spatial_axes: compartment+region+layer
    phenotype_axes: RES-CON+SUS-CON+SUS-RES
    main_or_ed: main_concise
    narrative: neuropil CA3-SR synaptic signalling, exact reconstructed running enrichment.
    primary_source: null
    input_dependencies:
      - results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv

  - id: v8_curve_rna
    renderer: e8_gsea_curve
    role: direct_evidence
    column_index: "2"
    program_key: rna
    spatial_axes: compartment+region
    phenotype_axes: RES-CON+SUS-CON+SUS-RES
    main_or_ed: main_concise
    narrative: neuronal soma CA2-SP mRNA processing.
    primary_source: null
    input_dependencies:
      - results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv

  - id: v8_curve_ox
    renderer: e8_gsea_curve
    role: direct_evidence
    column_index: "3"
    program_key: oxphos
    spatial_axes: compartment+region
    phenotype_axes: RES-CON+SUS-CON+SUS-RES
    main_or_ed: main_concise
    narrative: >-
      microglia-enriched CA1 oxidative phosphorylation, the only exemplar whose
      three-group ordering is fully FDR-supported.
    primary_source: null
    input_dependencies:
      - results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv

  - id: v8_prot_syn
    renderer: e8_protein_zoom
    role: leading_edge_proteins
    show_legend: false
    program_key: synaptic
    spatial_axes: region+layer
    phenotype_axes: RES-CON+SUS-CON+SUS-RES
    main_or_ed: main_unique
    narrative: the proteins carrying the CA3-SR synaptic program.
    primary_source: results/tables/11_spatial_systems/atlas/protein_sus_res_fdr_supported_atlas.csv

  - id: v8_prot_rna
    renderer: e8_protein_zoom
    role: leading_edge_proteins
    show_legend: false
    program_key: rna
    spatial_axes: region
    phenotype_axes: RES-CON+SUS-CON+SUS-RES
    main_or_ed: main_unique
    narrative: the proteins carrying the CA2-SP mRNA-processing program.
    primary_source: results/tables/11_spatial_systems/atlas/protein_sus_res_fdr_supported_atlas.csv

  - id: v8_prot_ox
    renderer: e8_protein_zoom
    role: leading_edge_proteins
    show_legend: true
    program_key: oxphos
    spatial_axes: region
    phenotype_axes: RES-CON+SUS-CON+SUS-RES
    main_or_ed: main_unique
    narrative: the proteins carrying the CA1 microglia-enriched OXPHOS program.
    primary_source: results/tables/11_spatial_systems/atlas/protein_sus_res_fdr_supported_atlas.csv


  # ===================== EXTENDED DATA ====================================
  - id: v8_ed_bilateral_full
    renderer: e8_ed_bilateral_full
    role: bilateral_audit
    spatial_axes: compartment+region+layer
    phenotype_axes: none_intentional
    main_or_ed: ed_deepens
    narrative: complete stored bilateral metric inventory; main 2f shows only the correlation.
    primary_source: results/tables/11_spatial_systems/bilateral/bilateral_spatial_identity_summary.csv
  - id: v8_ed_precision
    renderer: svp_precision_dumbbell
    role: measurement_quality
    spatial_axes: compartment+region
    phenotype_axes: none_intentional
    main_or_ed: ed_unique
    narrative: reliability gained by averaging hemispheres.
    primary_source: results/tables/11_spatial_systems/precision/bilateral_precision_gain.csv
  - id: v8_ed_fingerprint_full
    renderer: e8_ed_fingerprint_full
    role: full_baseline_spatial_fingerprint
    compact: false
    spatial_axes: compartment+region+layer
    phenotype_axes: none_intentional
    main_or_ed: ed_deepens
    narrative: >-
      the complete baseline fingerprint over external prespecified signatures;
      main 2d shows named proteins from CON-only contrasts instead.
    primary_source: results/tables/manuscript_candidates/spatial_v6/figure2_spatial_fingerprint_scores.csv
  - id: v8_ed_external_full
    renderer: e8_ed_external_full
    role: external_validation_audit
    spatial_axes: region+layer
    phenotype_axes: none_intentional
    main_or_ed: ed_deepens
    narrative: every tested pair including specificity comparisons; main 2g shows expected pairings only.
    primary_source: results/source_data/04_differential_expression_enrichment/control_spatial_identity_validation/global/figure2e_source_data.csv
  - id: v8_ed_internal_full
    renderer: e8_ed_internal_full
    role: internal_validation_audit
    spatial_axes: region+layer
    phenotype_axes: none_intentional
    main_or_ed: ed_deepens
    narrative: every canonical term per contrast; main 2h shows one term per contrast.
    primary_source: results/source_data/04_differential_expression_enrichment/control_spatial_identity_validation/global/figure2f_regions_CA1layers_source_data.csv
  - id: v8_ed_ca2_missing
    renderer: e8_ed_ca2_missingness
    role: ca2_qc
    spatial_axes: region+layer
    phenotype_axes: CON+RES+SUS
    main_or_ed: ed_unique
    narrative: pre-imputation missingness per CA2-SLM sample, by stress group.
    primary_source: results/tables/11_spatial_systems/ca2_slm_robustness/CA2_SLM_sample_context.csv
  - id: v8_ed_ca2_displacement
    renderer: s5_ed_ca2_displacement
    role: ca2_qc
    spatial_axes: region+layer
    phenotype_axes: CON+RES+SUS

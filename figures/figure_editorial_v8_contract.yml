    role: gsea_support_trajectory
    contrast: SUS - CON
    spatial_axes: compartment+region+layer
    phenotype_axes: SUS-CON
    main_or_ed: ed_unique
    narrative: the SUS vs CON atlas, completing the three-group trajectory.
    primary_source: results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv
  - id: v8_ed_identity
    renderer: e8_ed_identity_subsets
    role: stress_identity_robustness
    spatial_axes: region+layer
    phenotype_axes: SUS-RES
    main_or_ed: ed_unique
    narrative: the outside-baseline-affinity result across every robustness subset.
    primary_source: results/tables/11_spatial_systems/ca2_slm_robustness/stress_identity_robustness_comparison.csv
  - id: v8_ed_locations
    renderer: e8_ed_locations
    role: baseline_vs_stress_location
    spatial_axes: compartment+region+layer
    phenotype_axes: SUS-RES
    main_or_ed: ed_unique
    narrative: baseline dominant unit versus the location of the strongest SUS-RES effect.
    primary_source: results/tables/11_spatial_systems/atlas/protein_spatial_cell_affinity.csv
  - id: v8_ed_similarity
    renderer: e8_ed_similarity
    role: what_a_spatial_network_is
    spatial_axes: compartment+region+layer
    phenotype_axes: none_intentional
    main_or_ed: ed_unique
    narrative: >-
      CON molecular-similarity matrices with facet width proportional to unit
      count, and the not-connectivity statement promoted into the title.
    primary_source: results/tables/11_spatial_systems/networks/CON_spatial_molecular_similarity_matrix.csv
  - id: v8_ed_network_distance
    renderer: s5_ed_network_distance
    role: network_replicates
    spatial_axes: compartment
    phenotype_axes: CON+RES+SUS
    main_or_ed: ed_unique
    narrative: animal-level network distance from the CON consensus.
    primary_source: results/tables/11_spatial_systems/networks/animal_network_distance_from_CON.csv
  - id: v8_ed_nulls
    renderer: e8_ed_nulls
    role: network_null
    spatial_axes: compartment
    phenotype_axes: CON+RES+SUS

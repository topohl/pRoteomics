  - id: v8_ed_ca2_classes
    renderer: s5_ed_ca2_classes
    role: ca2_qc
    spatial_axes: region+layer
    phenotype_axes: SUS-RES
    main_or_ed: ed_unique
    narrative: robust / not claimable / unevaluable split.
    primary_source: results/tables/11_spatial_systems/ca2_slm_robustness/CA2_SLM_DAP_robustness.csv
  - id: v8_ed_ca2_sensitivity
    renderer: e8_ed_ca2_sensitivity
    role: ca2_qc
    spatial_axes: region+layer
    phenotype_axes: SUS-RES
    main_or_ed: ed_unique
    narrative: canonical effect versus the effect with QC-failed hemispheres dropped.
    primary_source: results/tables/11_spatial_systems/ca2_slm_robustness/CA2_SLM_DAP_robustness.csv
  - id: v8_ed_ca2_locator
    renderer: e8_ed_ca2_locator
    role: ca2_spatial_locator
    spatial_axes: compartment+region+layer
    phenotype_axes: none_intentional
    main_or_ed: ed_unique
    narrative: a small readable locator; the QC problem sits in neuropil, region CA2, layer SLM.
    primary_source: null
  - id: v8_ed_module_fingerprint
    renderer: e8_ed_module_fingerprint
    role: wgcna_spatial_fingerprint
    spatial_axes: compartment+region+layer
    phenotype_axes: none_intentional
    main_or_ed: ed_unique
    narrative: module by spatial-unit fingerprint; no structurally inapplicable cell is drawn.
    primary_source: results/tables/manuscript_candidates/spatial_v6/spatial_v6_module_spatial_fingerprint.csv
  - id: v8_ed_celltype
    renderer: nvp_ed_celltype
    role: wgcna_celltype
    spatial_axes: compartment
    phenotype_axes: none_intentional
    main_or_ed: ed_unique
    narrative: external cell-type affinity per compartment.
    primary_source: results/tables/11_spatial_systems/atlas/WGCNA_module_spatial_cell_affinity.csv
  - id: v8_ed_wgcna_phenotype
    renderer: e8_ed_wgcna_phenotype
    role: wgcna_phenotype_context
    spatial_axes: region+layer
    phenotype_axes: RES-CON+SUS-CON+SUS-RES
    main_or_ed: ed_unique
    narrative: >-
      module by contrast field with spatial peaks and external cell type, and
      the descriptive geometry stated numerically against the 0-of-45 FDR null.
    primary_source: results/source_data/manuscript_panels/figure_3/figure3b_stage07_effect_source.csv
    input_dependencies:
      - results/tables/06_modules_WGCNA/group_effects/
  - id: v8_ed_m11
    renderer: e8_ed_m11
    role: wgcna_worked_example
    spatial_axes: region+layer
    phenotype_axes: none_intentional
    main_or_ed: ed_unique
    narrative: m11 worked example; historical label unchanged, proposed label unactivated.
    primary_source: results/tables/manuscript_candidates/spatial_v6/spatial_v6_module_spatial_fingerprint.csv
  - id: v8_ed_gsea_curve_syn
    renderer: e8_ed_gsea_curve
    role: gsea_support_detailed
    program_key: synaptic
    spatial_axes: region+layer
    phenotype_axes: RES-CON+SUS-CON+SUS-RES
    main_or_ed: ed_deepens

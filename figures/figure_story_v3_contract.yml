# Story-v3 candidate contract.
#
# NOT the manuscript contract. The canonical contract, the Part-16 candidate
# layer and the Part-17 nature_v2 layer are all frozen. Outputs live under
# results/**/manuscript_candidates/story_v3/**.
#
# Panels are ordered by ARGUMENT, not by which analysis exists. Each panel
# carries a `narrative` line saying what it establishes and why the next panel
# follows; figure_story_map.md is generated from those lines.

contract_version: manuscript_story_v3_figures_v1
status: candidate_only_not_promoted
palette: config/manuscript_palette.yml

panels:

  # ------------------------------------------------------------ FIGURE 2
  - id: sv2_anchor
    renderer: nvp_spatial_anchor
    role: experimental_anchor
    narrative: >-
      establishes what was sampled: 18 spatial units across four subfields and
      three compartments, bilaterally, in nine animals, with AnimalID as the
      biological replicate. Every later spatial panel is read against this map.
    primary_source: null

  - id: sv2_depth
    renderer: nvp_depth_compact
    role: technical_context
    narrative: >-
      shows the measurement is deep enough in every compartment to make the
      following comparisons meaningful.
    primary_source: results/source_data/manuscript/figure_02/figure_02b_source_data.csv

  - id: sv2_pca
    renderer: svp_pca
    role: global_structure
    narrative: >-
      asks whether the measured proteomes occupy structured molecular spaces at
      all, and shows compartment and region separating without any stress
      model. That motivates asking whether the structure is reproducible.
    primary_source: results/source_data/manuscript/figure_02/figure_02c_source_data.csv
    input_dependencies:
      - results/tables/03_qc_exploration/00b_joint_compartment_qc/global/joint_primary_pca_variance_explained.csv

  - id: sv2_bilateral
    renderer: nvp_bilateral
    role: reproducibility
    narrative: >-
      shows the same anatomical contrast estimated independently in left and
      right hemisphere gives the same answer, so the spatial architecture is
      reproducible rather than an artefact of one dissection.
    primary_source: results/tables/11_spatial_systems/bilateral/bilateral_spatial_identity_protein_level.csv
    input_dependencies:
      - results/tables/11_spatial_systems/bilateral/bilateral_spatial_identity_summary.csv

  - id: sv2_precision
    renderer: svp_precision_dumbbell
    role: measurement_quality
    narrative: >-
      quantifies what that reproducibility buys: averaging the two hemispheres
      raises reliability for module, marker and compartment endpoints alike.
    primary_source: results/tables/11_spatial_systems/precision/bilateral_precision_gain.csv

  - id: sv2_compartment
    renderer: nvp_compartment
    role: compartment_identity
    narrative: >-
      turns from reproducibility to identity: the dissected compartments carry
      the markers they should, so the spatial units mean what they claim.
    primary_source: results/source_data/03_qc_exploration/04e_control_compartment_abundance_publication_figures/global/figure2d_compact_marker_enrichment_differences_v2_source_data.csv

  - id: sv2_external
    renderer: nvp_external_validation
    role: external_validation
    narrative: >-
      tests that identity against an independent external atlas, so the claim
      does not rest on our own markers alone.
    primary_source: results/source_data/04_differential_expression_enrichment/control_spatial_identity_validation/global/figure2e_source_data.csv

  - id: sv2_internal
    renderer: nvp_internal_validation
    role: internal_validation
    narrative: >-
      closes the chain at the level of biology rather than of single markers:
      internal anatomical contrasts recover known regional programs, so the
      measurement is ready to be asked a phenotype question in Figure 3.
    primary_source: results/source_data/04_differential_expression_enrichment/control_spatial_identity_validation/global/figure2f_regions_CA1layers_source_data.csv

  # ------------------------------------------------------------ FIGURE 3
  - id: sv3_da
    renderer: nvp_da_landscape
    role: sparse_landscape
    narrative: >-
      establishes the scale of the problem: individual-protein differences
      between later-resilient and later-susceptible animals are sparse and
      spatially restricted, and most of the one apparent cluster is not
      claimable after QC. That is why the question has to be asked at the level
      of coordinated programs.
    primary_source: results/source_data/04_differential_expression_enrichment/sus_res_spatial_dap_atlas/global/sus_res_dap_membership.csv
    input_dependencies:
      - results/tables/11_spatial_systems/atlas/protein_spatial_cell_affinity.csv

  - id: sv3_atlas
    renderer: nvp_gsea_atlas
    role: program_atlas
    narrative: >-
      asks that question and answers it: coordinated program-level differences
      are present across all three compartments even where single-protein
      significance is absent. It also shows the signal is spatially structured,
      which raises the obvious next question - where.
    primary_source: results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv

  - id: sv3_anatomy
    renderer: svp_anatomy_bridge
    role: anatomical_bridge
    narrative: >-
      answers it by putting three prespecified supported programs back onto the
      sampling map from Figure 2a, with their direction. The reader now knows
      which programs, in which compartment, and where - and can ask what the
      underlying ranked evidence looks like.
    primary_source: results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv

  - id: sv3_ex_neuropil
    renderer: svp_rank_example
    role: direct_evidence
    program_key: synaptic
    narrative: >-
      shows the neuropil program directly in the ranked proteome rather than as
      another summary: its proteins concentrate at the RES end of the ranking.
    primary_source: null

  - id: sv3_ex_soma
    renderer: svp_rank_example
    role: direct_evidence
    program_key: rna
    narrative: >-
      shows the same grammar in a different compartment and the opposite
      direction, so the effect is not one compartment's artefact.
    primary_source: null

  - id: sv3_ex_microglia
    renderer: svp_rank_example
    role: direct_evidence
    program_key: oxphos
    narrative: >-
      completes the triptych in the microglia-enriched compartment, showing the
      phenotype is not confined to neuronal tissue.
    primary_source: null

  - id: sv3_proteins
    renderer: svp_protein_zoom
    role: molecular_zoom
    top_n: 7
    narrative: >-
      makes the programs molecular: the leading-edge proteins behind each of
      the three programs, shown across their own compartment's spatial units,
      so the reader sees which proteins actually carry the pathway signal and
      how spatially confined they are.
    primary_source: null

  - id: sv3_wgcna_circle
    renderer: svp_wgcna_circle
    role: systems_context
    narrative: >-
      asks whether those programs sit inside coherent protein networks, and
      answers with module STRUCTURE only - spatial specificity, spatial peak
      and paired-hemisphere reproducibility. No phenotype significance is
      encoded, because none survives FDR.
    primary_source: results/tables/11_spatial_systems/atlas/WGCNA_module_spatial_cell_affinity.csv

  - id: sv3_wgcna_strip
    renderer: svp_wgcna_strip
    role: systems_context_alternative
    narrative: >-
      the same systems information in a linear encoding, built so the circular
      and linear forms can be compared like for like.
    primary_source: results/tables/11_spatial_systems/atlas/WGCNA_module_spatial_cell_affinity.csv


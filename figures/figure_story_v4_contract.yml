      - {panel: s4_pca,         label: b, x: 4,   "y": 54,  w: 58,  h: 48}
      - {panel: s4_bilateral,   label: c, x: 66,  "y": 54,  w: 78,  h: 48}
      - {panel: s4_precision,   label: d, x: 148, "y": 54,  w: 31,  h: 48}
      - {panel: s4_compartment, label: e, x: 4,   "y": 106, w: 52,  h: 58}
      - {panel: s4_external,    label: f, x: 60,  "y": 106, w: 58,  h: 58}
      - {panel: s4_internal,    label: g, x: 122, "y": 106, w: 57,  h: 58}

  - name: F3_STORY_V4
    figure_key: figure_03
    width_mm: 183
    height_mm: 168
    question: What molecular programs distinguish resilient and susceptible outcomes, where do they occur, and what proteins carry them?
    layout:
      - {panel: s4_overview,     label: a, x: 4,  "y": 4,   w: 175, h: 30}
      - {panel: s4_atlas,        label: b, x: 4,  "y": 38,  w: 175, h: 52}
      - {panel: s4_ex_neuropil,  label: c, x: 4,  "y": 94,  w: 58,  h: 40}

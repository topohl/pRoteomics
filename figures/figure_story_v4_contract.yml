# Story-v4 candidate contract.
#
# Fifth candidate family. Canonical, Part-16, Part-17 and Part-18/story_v3 are
# all frozen. Outputs live under results/**/manuscript_candidates/story_v4/**.
#
# Designed from the evidence inventory, not from the existing panels. Every
# panel carries a `narrative` line; wireframes are generated from the same
# layout blocks so composition is inspected before any plot is rendered.

contract_version: manuscript_story_v4_figures_v1
status: candidate_only_not_promoted
palette: config/manuscript_palette.yml

panels:

  # ------------------------------------------------------------ FIGURE 2
  - id: s4_schematic
    renderer: s4_schematic
    role: experimental_anatomy_anchor
    narrative: >-
      orients the reader in real hippocampal anatomy: both hemispheres, CA1 to
      DG, the neuropil layers, and the three dissected compartments. Every
      later spatial statement is read against this picture.
    primary_source: null

  - id: s4_depth
    renderer: nvp_depth_compact
    role: technical_context
    narrative: >-
      confirms the measurement is deep enough in each compartment for the
      comparisons that follow.
    primary_source: results/source_data/manuscript/figure_02/figure_02b_source_data.csv

  - id: s4_pca
    renderer: svp_pca
    role: global_structure
    narrative: >-
      shows the proteomes occupy structured molecular spaces, with compartment
      and region separating before any stress model is applied.
    primary_source: results/source_data/manuscript/figure_02/figure_02c_source_data.csv
    input_dependencies:
      - results/tables/03_qc_exploration/00b_joint_compartment_qc/global/joint_primary_pca_variance_explained.csv

  - id: s4_bilateral
    renderer: s4_bilateral
    role: reproducibility
    narrative: >-
      tests whether that structure reproduces across paired hemispheres, across
      EVERY prespecified anatomical contrast. Coarse regional contrasts
      reproduce strongly and fine CA1 laminar contrasts less so, and both are
      shown rather than only the median.
    primary_source: results/tables/11_spatial_systems/bilateral/bilateral_spatial_identity_protein_level.csv
    input_dependencies:
      - results/tables/11_spatial_systems/bilateral/bilateral_spatial_identity_summary.csv

  - id: s4_precision
    renderer: svp_precision_dumbbell
    role: measurement_quality
    narrative: >-
      quantifies the gain from averaging hemispheres, as a compact companion to
      the reproducibility panel rather than a full-size result.
    primary_source: results/tables/11_spatial_systems/precision/bilateral_precision_gain.csv

  - id: s4_compartment
    renderer: s4_compartment
    role: compartment_identity
    narrative: >-
      turns to identity: ten named canonical markers carry the expected
      compartment pattern, so the dissected units mean what they claim.
    primary_source: results/source_data/03_qc_exploration/04e_control_compartment_abundance_publication_figures/global/figure2d_compact_recognizable_markers_v2_source_data.csv

  - id: s4_external
    renderer: nvp_external_validation
    role: external_validation
    narrative: >-
      confirms that identity against an independent external atlas, so it does
      not rest on our own marker choice.
    primary_source: results/source_data/04_differential_expression_enrichment/control_spatial_identity_validation/global/figure2e_source_data.csv

  - id: s4_internal
    renderer: nvp_internal_validation
    role: internal_validation
    narrative: >-
      closes the chain with biology rather than markers: internal anatomical
      contrasts recover known regional programs, so the dataset is ready to be
      asked a phenotype question.
    primary_source: results/source_data/04_differential_expression_enrichment/control_spatial_identity_validation/global/figure2f_regions_CA1layers_source_data.csv

  # ------------------------------------------------------------ FIGURE 3
  - id: s4_overview
    renderer: s4_overview
    role: spatial_stress_overview
    narrative: >-
      shows where stress-associated effects occur across all three
      compartments: individual-protein effects are sparse and spatially
      restricted, while program-level support is broad. That contrast is the
      reason the rest of the figure works at program level.
    primary_source: results/source_data/04_differential_expression_enrichment/sus_res_spatial_dap_atlas/global/sus_res_dap_membership.csv
    input_dependencies:
      - results/tables/11_spatial_systems/atlas/protein_spatial_cell_affinity.csv
      - results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv

  - id: s4_atlas
    renderer: nvp_gsea_atlas
    role: program_atlas
    narrative: >-
      is the quantitative centrepiece: coordinated program differences across
      curated themes and every canonical spatial context, in all three
      compartments.
    primary_source: results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv

  - id: s4_ex_neuropil
    renderer: s4_gsea_curve
    role: direct_evidence
    program_key: synaptic
    narrative: >-
      shows the neuropil synaptic program as a conventional enrichment plot,
      with its RES-CON, SUS-CON and SUS-RES trajectory underneath.
    primary_source: null
    input_dependencies:
      - results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv

  - id: s4_ex_soma
    renderer: s4_gsea_curve
    role: direct_evidence
    program_key: rna
    narrative: >-
      shows the soma mRNA-processing program in the same grammar and the
      opposite direction.
    primary_source: null
    input_dependencies:
      - results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv

  - id: s4_ex_microglia
    renderer: s4_gsea_curve
    role: direct_evidence
    program_key: oxphos
    narrative: >-
      completes the triptych in the microglia-enriched compartment, where both
      stressed groups shift together rather than diverging.
    primary_source: null
    input_dependencies:
      - results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv

  - id: s4_proteins
    renderer: s4_proteins
    role: molecular_zoom
    top_n: 8
    narrative: >-
      names the molecules: the leading-edge proteins of each program across all
      three canonical group contrasts, so the trajectory is visible at protein
      level and the programs stop being abstract.
    primary_source: null

figures:

  - name: F2_STORY_V4
    figure_key: figure_02
    width_mm: 183
    height_mm: 168
    question: Does the spatial proteomics dataset faithfully resolve reproducible, biologically meaningful hippocampal molecular architecture?
    layout:
      - {panel: s4_schematic,   label: a, x: 4,   "y": 4,   w: 126, h: 44}
      - {panel: s4_depth,       label: b, x: 134, "y": 4,   w: 45,  h: 44}
      - {panel: s4_pca,         label: c, x: 4,   "y": 52,  w: 62,  h: 48}
      - {panel: s4_bilateral,   label: d, x: 70,  "y": 52,  w: 109, h: 48}
      - {panel: s4_compartment, label: e, x: 4,   "y": 104, w: 52,  h: 60}
      - {panel: s4_external,    label: f, x: 60,  "y": 104, w: 58,  h: 60}

  - name: F3_NATURE_CROSSCOMPARTMENT
    figure_key: figure_03
    width_mm: 183
    height_mm: 170
    message: >-
      Stress reorganises coordinated molecular programs across all three
      measured compartments, while individual-protein effects stay sparse.
    layout:
      - {panel: n3_da,           label: a, x: 4,   "y": 4,   w: 175, h: 30}
      - {panel: n3_atlas,        label: b, x: 4,   "y": 38,  w: 175, h: 58}
      - {panel: n3_ex_neuropil,  label: c, x: 4,   "y": 100, w: 57,  h: 36}

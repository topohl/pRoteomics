  - name: F2_NATURE_A
    figure_key: figure_02
    width_mm: 183
    height_mm: 170
    message: >-
      Spatial proteomics resolves anatomically meaningful, compartment-specific
      and paired-hemisphere-reproducible hippocampal molecular architecture.
    layout:

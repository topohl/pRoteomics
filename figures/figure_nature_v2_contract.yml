# Nature-style v2 candidate figure contract.
#
# NOT the manuscript contract. figures/figure_contract.yml remains the sole
# authority for Figures 2 and 3, and the Part-16 candidate layer
# (figures/figure_candidate_contract.yml) is also left untouched. This is a
# third, independent layer whose outputs live under
# results/**/manuscript_candidates/nature_v2/**.
#
# SIZE CONTRACT: every figure is exactly 183 mm wide and at most 170 mm high.
# Every panel declares its EXACT final box in millimetres and is rendered at
# that box, so nothing is rescaled at assembly and point sizes on the page are
# the point sizes in the theme. nv_verify_scale() fails the build otherwise.
#
# Panel labels are lowercase bold and are drawn by the assembler, not by the
# panels. Panels carry no titles or subtitles: that text belongs in the figure
# legend.

contract_version: manuscript_nature_v2_figures_v1
compares_against: manuscript_figures_v2
status: candidate_only_not_promoted
palette: config/manuscript_palette.yml

panels:

  # ---------------------------------------------------------- FIGURE 2
  - id: n2_anchor
    renderer: nvp_spatial_anchor
    role: spatial_experimental_anchor
    question: What was sampled, where, and what is the biological replicate?
    primary_source: null
    caveat: >-
      Schematic only. No histology or anatomical imagery is fabricated; the
      final panel is to be drawn in Illustrator from real tissue if a suitable
      source exists.

  - id: n2_depth
    renderer: nvp_depth_compact
    role: technical_depth
    question: How deep is the proteome in each compartment?
    primary_source: results/source_data/manuscript/figure_02/figure_02b_source_data.csv
    caveat: Technical QC. Candidate for Extended Data rather than a main panel.

  - id: n2_bilateral
    renderer: nvp_bilateral
    role: paired_hemisphere_reproducibility
    question: Does the same anatomical contrast reproduce across hemispheres?
    primary_source: results/tables/11_spatial_systems/bilateral/bilateral_spatial_identity_protein_level.csv
    input_dependencies:
      - results/tables/11_spatial_systems/bilateral/bilateral_spatial_identity_summary.csv
    caveat: >-
      Paired measurements within one animal. Never independent replicates.

  - id: n2_precision
    renderer: nvp_precision_inset
    role: measurement_reliability
    question: How much reliability does bilateral averaging add?
    primary_source: results/tables/11_spatial_systems/precision/bilateral_precision_gain.csv
    caveat: Reliability descriptor, not a stress effect.

  - id: n2_compartment
    renderer: nvp_compartment
    role: compartment_identity
    question: Are the dissected compartments molecularly what they claim to be?
    primary_source: results/source_data/03_qc_exploration/04e_control_compartment_abundance_publication_figures/global/figure2d_compact_marker_enrichment_differences_v2_source_data.csv
    caveat: Candidate alternative to canonical 2d; canonical 2d is unchanged.

  - id: n2_external
    renderer: nvp_external_validation
    role: external_spatial_validation
    question: Does an independent external dataset recover the same spatial identity?
    primary_source: results/source_data/04_differential_expression_enrichment/control_spatial_identity_validation/global/figure2e_source_data.csv
    caveat: External signature enrichment; FDR support marked explicitly.

  - id: n2_internal
    renderer: nvp_internal_validation
    role: internal_anatomical_validation
    question: Do internal anatomical contrasts recover known regional programs?
    primary_source: results/source_data/04_differential_expression_enrichment/control_spatial_identity_validation/global/figure2f_regions_CA1layers_source_data.csv
    caveat: Only the strongest FDR-supported terms are shown; the rest is tabular.

  # ---------------------------------------------------------- FIGURE 3
  - id: n3_da
    renderer: nvp_da_landscape
    role: differential_proteome_landscape
    question: How sparse are protein-level stress effects, and across which compartments?
    primary_source: results/source_data/04_differential_expression_enrichment/sus_res_spatial_dap_atlas/global/sus_res_dap_membership.csv
    input_dependencies:
      - results/tables/11_spatial_systems/atlas/protein_spatial_cell_affinity.csv
    caveat: >-
      Canonical BH FDR counts are preserved exactly. A square-root count axis
      keeps CA2-SLM from dominating; the full 6/10/12 QC decomposition belongs
      in Extended Data. Only CA2-SLM is audited; all other units read
      not_audited.

  - id: n3_atlas
    renderer: nvp_gsea_atlas
    role: ranked_gsea_program_atlas
    question: Where does the ranked GSEA program signal sit across all compartments?
    primary_source: results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv
    caveat: >-
      Theme aggregation is an interpretation layer, NOT a new FDR family. The
      cell is the median NES of constituent canonical GO-BP terms; the dot
      marks that at least one of those terms is FDR-supported in the canonical
      analysis. Daggered rows are qc_review themes shown as QC context.

  - id: n3_ex_neuropil
    renderer: nvp_ranked_example
    role: representative_ranked_evidence
    question: What does the neuropil synaptic signal look like in the ranked list?
    primary_source: null
    example_dataset: neuron_neuropil
    example_unit_dir: CA3_sr
    example_contrast_dir: CA3srsus_CA3srres
    example_term_id: "GO:0099536"
    caveat: >-
      Gene ranks and leading-edge membership are read from the canonical
      clusterProfiler audit files. No enrichment is recomputed.

  - id: n3_ex_soma
    renderer: nvp_ranked_example
    role: representative_ranked_evidence
    question: What does the soma RNA-processing signal look like in the ranked list?
    primary_source: null
    example_dataset: neuron_soma
    example_unit_dir: CA2_sp
    example_contrast_dir: CA2spsus_CA2spres
    example_term_id: "GO:0006397"
    caveat: Same provenance as the neuropil example; opposite direction.

  - id: n3_ex_microglia
    renderer: nvp_ranked_example
    role: representative_ranked_evidence
    question: What does the microglial OXPHOS signal look like in the ranked list?
    primary_source: null
    example_dataset: microglia
    example_unit_dir: CA1_microglia
    example_contrast_dir: CA1microgliasus_CA1microgliares
    example_term_id: "GO:0006119"
    caveat: Same provenance as the other two examples.

  - id: n3_identity
    renderer: nvp_stress_identity
    role: effect_versus_baseline_affinity
    question: Do stress effects sit outside a protein's dominant baseline niche?
    primary_source: results/tables/11_spatial_systems/atlas/protein_spatial_cell_affinity.csv
    caveat: >-
      Rank is scaled by the protein's own number of units so 10-unit neuropil
      and 4-unit soma/microglia are comparable. This is where the effect sits,
      not movement of protein between compartments.

  - id: n3_synthesis
    renderer: nvp_synthesis
    role: cross_method_synthesis
    question: Which programs recur across compartments?
    primary_source: results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv
    caveat: >-
      Contextual convergence across compartments, not independent validations.

  - id: n3_wgcna_small
    renderer: nvp_wgcna_small
    role: descriptive_wgcna_supporting
    question: Do module-level effects show any consistent direction?
    primary_source: results/source_data/manuscript_panels/figure_3/figure3b_stage07_effect_source.csv
    caveat: >-
      DESCRIPTIVE ONLY. Zero of 45 module x contrast cells reach tier-specific
      FDR < 0.05 (minimum 0.245), so no significance symbol is drawn.

  # ------------------------------------------------- WGCNA EXTENDED DATA
  - id: ned_modules
    renderer: nvp_ed_module_identity
    role: wgcna_module_structure
    question: What is the spatial specificity and bilateral reproducibility of each module?
    primary_source: results/tables/11_spatial_systems/atlas/WGCNA_module_spatial_cell_affinity.csv
    caveat: Module structure is robust descriptive molecular architecture.

  - id: ned_celltype
    renderer: nvp_ed_celltype
    role: wgcna_celltype_annotation
    question: Which external cell types are modules associated with?
    primary_source: results/tables/11_spatial_systems/atlas/WGCNA_module_spatial_cell_affinity.csv
    caveat: External EWCE affinity, counted per compartment.

  - id: ned_wgcna_heatmap
    renderer: nvp_ed_wgcna_heatmap
    role: wgcna_phenotype_effects
    question: What are the module-level group effects?
    primary_source: results/source_data/manuscript_panels/figure_3/figure3b_stage07_effect_source.csv
    caveat: >-
      DESCRIPTIVE ONLY. No module x contrast cell survives FDR. This is why the
      phenotype heatmap belongs here and not in the main figure.


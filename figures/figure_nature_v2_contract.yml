      - {panel: n2_depth,       label: b, x: 100, "y": 4,   w: 79,  h: 50}
      - {panel: n2_bilateral,   label: c, x: 4,   "y": 58,  w: 140, h: 44}
      - {panel: n2_precision,   label: d, x: 148, "y": 58,  w: 31,  h: 44}
      - {panel: n2_compartment, label: e, x: 4,   "y": 106, w: 88,  h: 58}
      - {panel: n2_external,    label: f, x: 96,  "y": 106, w: 83,  h: 58}

  - name: F2_NATURE_B
    figure_key: figure_02

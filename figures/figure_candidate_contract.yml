      independent line of evidence?
    evidence_type: evidence_integration_matrix
    inferential_status: evidence_inventory_not_a_statistical_test
    biological_unit: program
    hemisphere_handling: mixed_per_evidence_column_recorded_in_source_data
    primary_source: results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv
    input_dependencies:

      - results/source_data/manuscript_panels/figure_3/figure3b_stage07_effect_source.csv
      - results/tables/11_spatial_systems/bilateral/WGCNA_module_bilateral_reproducibility.csv
      - results/tables/11_spatial_systems/atlas/WGCNA_module_spatial_cell_affinity.csv
    required_columns: [theme_id, manuscript_theme, theme_role]
    overlaps_existing_panel: none
    likely_role: possible_extension
    caveat: >-
      Every cell names its source artifact. Evidence is never collapsed into a
      single numerical score and the matrix is not a test.

  - id: 3x_program_examples
    candidate_figure: "03"
    title: Selected QC-clean program examples
    render_mode: render_candidate
    renderer: cfp_render_program_examples
    scientific_question: >-
      For a small number of prespecified, QC-clean programs, what does the
      per-spatial-unit ranked GSEA evidence actually look like?
    evidence_type: per_program_spatial_gsea_detail
    inferential_status: descriptive_with_constituent_FDR_marked
    biological_unit: animal_level_ranked_gsea_per_spatial_unit
    hemisphere_handling: inherited_from_canonical_animal_level_contrast
    primary_source: results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv
    input_dependencies:
      - config/manuscript_go_theme_registry.tsv
    required_columns: [dataset, contrast, spatial_unit, GO_ID, NES, GSEA_FDR, theme_id, theme_role]
    overlaps_existing_panel: "3c"
    likely_role: possible_extension
    caveat: >-
      The selection rule is prespecified and recorded in the source data. No
      running-enrichment curve is drawn because no gseaResult object is stored
      anywhere in the repository, and re-running GSEA is forbidden here.

  - id: 3x_stress_identity
    candidate_figure: "03"
    title: Stress effects relative to baseline spatial affinity
    render_mode: render_candidate
    renderer: cfp_render_stress_identity
    scientific_question: >-
      Do stress-associated abundance effects tend to occur outside the
      protein's dominant baseline spatial niche, and does that hold after the
      QC robustness audit?
    evidence_type: effect_versus_baseline_affinity
    inferential_status: descriptive_classification_from_canonical_labels
    biological_unit: protein
    hemisphere_handling: canonical_animal_level_hemisphere_averaged
    primary_source: results/tables/11_spatial_systems/ca2_slm_robustness/stress_identity_robustness_comparison.csv
    input_dependencies:
      - results/tables/11_spatial_systems/atlas/protein_spatial_cell_affinity.csv
    required_columns: [subset, n_hits, effect_outside_baseline_affinity, fraction_outside_baseline_affinity, median_baseline_rank]
    overlaps_existing_panel: none
    likely_role: likely_main
    caveat: >-
      The extreme rank-10 tail did not survive the QC audit and is deliberately
      not emphasised. This is not protein redistribution; it is where the
      effect sits relative to the protein's own baseline ranking.

  - id: 3x_dap_status
    candidate_figure: "03"
    title: Spatial DAP counts with interpretation status
    render_mode: render_candidate
    renderer: cfp_render_dap_status
    scientific_question: >-

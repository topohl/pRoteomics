    biological_unit: animal
    hemisphere_handling: canonical_animal_level_hemisphere_averaged
    primary_source: results/source_data/04_differential_expression_enrichment/sus_res_spatial_dap_atlas/global/panel_a_sus_res_dap_counts.csv
    input_dependencies:
      - results/source_data/04_differential_expression_enrichment/sus_res_spatial_dap_atlas/global/sus_res_dap_membership.csv
      - results/tables/11_spatial_systems/atlas/protein_spatial_cell_affinity.csv
    required_columns: [dataset, spatial_unit, n_DAP_FDR05, direction, signed_count]
    overlaps_existing_panel: "3a"
    likely_role: candidate_replacement
    caveat: >-
      Canonical FDR counts are preserved exactly and remain visible. Only
      CA2-SLM has an audited robustness status; every other unit is shown as
      not_audited and is never displayed as claimable.


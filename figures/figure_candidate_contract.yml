  # ============================================================ FIGURE 3

  - id: 3x_gsea_atlas_susres
    candidate_figure: "03"
    title: Ranked GSEA program atlas, SUS-RES primary with contrast strips
    render_mode: render_candidate
    renderer: cfp_render_gsea_atlas_susres
    scientific_question: >-
      Across curated biological programs and canonical spatial contexts, where
      does the ranked GSEA signal sit, and which cells are backed by
      FDR-supported constituent GO terms?
    evidence_type: ranked_gsea_theme_summary
    inferential_status: descriptive_theme_summary_constituent_FDR_marked
    biological_unit: animal_level_ranked_gsea_per_spatial_unit
    hemisphere_handling: inherited_from_canonical_animal_level_contrast
    primary_source: results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv
    input_dependencies:
      - config/manuscript_go_theme_registry.tsv
    required_columns: [dataset, contrast, spatial_unit, GO_ID, NES, GSEA_FDR, theme_id, manuscript_theme, theme_role, assignment_status]
    overlaps_existing_panel: none
    likely_role: likely_main
    caveat: >-
      A theme cell summarises its constituent GO terms. The summary itself is
      NOT a test; FDR support is marked from the actual constituent terms and
      themes with theme_role qc_review are shown as QC context only.

  - id: 3x_gsea_atlas_blocks
    candidate_figure: "03"
    title: Ranked GSEA program atlas, three aligned contrast blocks
    render_mode: render_candidate
    renderer: cfp_render_gsea_atlas_blocks
    scientific_question: >-
      Same as 3x_gsea_atlas_susres, rendered as three aligned contrast blocks
      (RES-CON, SUS-CON, SUS-RES) so the contrast geometry is directly visible.
    evidence_type: ranked_gsea_theme_summary
    inferential_status: descriptive_theme_summary_constituent_FDR_marked
    biological_unit: animal_level_ranked_gsea_per_spatial_unit
    hemisphere_handling: inherited_from_canonical_animal_level_contrast
    primary_source: results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv
    input_dependencies:
      - config/manuscript_go_theme_registry.tsv
    required_columns: [dataset, contrast, spatial_unit, GO_ID, NES, GSEA_FDR, theme_id, manuscript_theme, theme_role, assignment_status]
    overlaps_existing_panel: none
    likely_role: candidate_replacement
    caveat: >-
      Rendered as an alternative layout of the same evidence as
      3x_gsea_atlas_susres. Only one of the two should ever be used.

  - id: 3x_wgcna_annotated
    candidate_figure: "03"
    title: Global WGCNA module effects with program and context annotation
    render_mode: render_candidate
    renderer: cfp_render_wgcna_annotated
    scientific_question: >-
      Do the global module-level contrast effects align with module identity,
      supermodule membership, external cell-type affinity and bilateral
      reproducibility?
    evidence_type: wgcna_stage07_global_module_effects_annotated
    inferential_status: model_effect_with_explicit_tier_specific_FDR
    biological_unit: animal
    hemisphere_handling: equal_weight_available_LR_after_within_hemisphere_mean
    primary_source: results/source_data/manuscript_panels/figure_3/figure3b_stage07_effect_source.csv
    input_dependencies:
      - results/tables/11_spatial_systems/atlas/WGCNA_module_spatial_cell_affinity.csv
      - results/tables/11_spatial_systems/bilateral/WGCNA_module_bilateral_reproducibility.csv
    required_columns: [dataset, module_id, contrast, estimate, tier_specific_fdr, model_valid_for_inference]
    expected_rows: 45
    overlaps_existing_panel: "3d"
    likely_role: candidate_replacement
    caveat: >-
      The effect values are REUSED verbatim from the canonical panel source.
      Only side annotations are added. The descriptive RES > CON > SUS
      geometry is never drawn as if it were significant; FDR support is a
      separate explicit symbol.

  - id: 3x_convergence
    candidate_figure: "03"

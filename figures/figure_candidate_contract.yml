# Candidate manuscript-figure contract.
#
# THIS IS NOT THE MANUSCRIPT CONTRACT. figures/figure_contract.yml remains the
# sole authority for Figures 2 and 3. Nothing here promotes, replaces or
# deletes a canonical panel, and the entire candidate layer can be deleted
# without affecting the canonical pipeline.
#
# Candidate panel IDs are deliberately NOT of the canonical 2a-2f / 3a-3e form.
# Every candidate id carries an `x` (new candidate) or `ref` (an unmodified
# reference copy of a canonical panel, used only so variants can be compared
# side by side).
#
# Candidate renderers are DOWNSTREAM RENDERERS. They join, filter, reshape,
# annotate and visualize already-validated canonical outputs. They do not fit
# differential-abundance models, refit WGCNA, run GSEA or EWCE, recompute FDR,
# or generate any new phenotype test.

contract_version: manuscript_candidate_figures_v1
compares_against: manuscript_figures_v2
canonical_contract: figures/figure_contract.yml
status: candidate_only_not_promoted

panels:

  # ============================================================ FIGURE 2

  - id: 2x_bilateral
    candidate_figure: "02"
    title: Paired hemisphere reproducibility of anatomical contrast effects
    render_mode: render_candidate
    renderer: cfp_render_bilateral_concordance
    scientific_question: >-
      Does the same anatomical contrast produce the same protein-level effect
      when it is estimated independently in the left and the right hemisphere?
    evidence_type: paired_hemisphere_reproducibility
    inferential_status: descriptive_reproducibility_not_a_stress_inference
    biological_unit: protein_within_animal_paired_hemisphere
    hemisphere_handling: paired_hemisphere_reproducibility_never_independent_replicates
    primary_source: results/tables/11_spatial_systems/bilateral/bilateral_spatial_identity_protein_level.csv
    input_dependencies:
      - results/tables/11_spatial_systems/bilateral/bilateral_spatial_identity_summary.csv
    required_columns: [dataset, contrast, ProteinGroupID, estimate_L, estimate_R, sign_agreement]
    overlaps_existing_panel: "2c"
    likely_role: candidate_replacement
    caveat: >-
      Hemispheres are paired measurements within one animal. They are never
      independent biological replicates and the annotated statistics are
      reproducibility descriptors, not group inference.

  - id: 2x_precision
    candidate_figure: "02"
    title: Precision benefit of bilateral sampling
    render_mode: render_candidate
    renderer: cfp_render_precision_gain
    scientific_question: >-
      How much measurement reliability is gained by averaging the two
      hemispheres instead of using a single side?
    evidence_type: variance_decomposition_reliability
    inferential_status: descriptive_reliability_estimate
    biological_unit: animal_endpoint
    hemisphere_handling: single_side_versus_equal_weight_bilateral_mean
    primary_source: results/tables/11_spatial_systems/precision/bilateral_precision_gain.csv
    input_dependencies:
      - results/tables/11_spatial_systems/precision/bilateral_variance_decomposition.csv
    required_columns: [dataset, endpoint_class, endpoint_id, ICC_single_side, ICC_bilateral_mean]
    overlaps_existing_panel: none
    likely_role: possible_extension
    caveat: >-
      ICC is a reliability descriptor of the measurement, not evidence of a
      stress effect. Endpoints with singular variance fits are flagged.

  - id: 2x_wgcna_bilateral
    candidate_figure: "02"
    title: WGCNA module bilateral reproducibility
    render_mode: render_candidate
    renderer: cfp_render_wgcna_bilateral
    scientific_question: >-
      Do molecular programs retain their level and their spatial organization
      across hemispheres?
    evidence_type: module_level_paired_hemisphere_reproducibility
    inferential_status: descriptive_reproducibility
    biological_unit: module_eigengene_within_animal
    hemisphere_handling: paired_hemisphere_reproducibility
    primary_source: results/tables/11_spatial_systems/bilateral/WGCNA_module_bilateral_reproducibility.csv
    input_dependencies: []
    required_columns: [dataset, level, endpoint_id, pearson_r, median_profile_Pearson, bilateral_reproducibility_class]
    overlaps_existing_panel: none
    likely_role: extended_data
    caveat: >-
      Only two reproducibility axes are shown. The full QC metric set stays in
      the spatial-systems tables.

  - id: 2x_compartment_bilateral
    candidate_figure: "02"
    title: Compartment identity with cross-hemisphere concordance
    render_mode: render_candidate
    renderer: cfp_render_compartment_plus_bilateral
    scientific_question: >-
      Is compartment identity supported both by intended-minus-comparator
      marker abundance and by cross-hemisphere agreement of the same contrast?
    evidence_type: marker_abundance_plus_paired_hemisphere_concordance
    inferential_status: descriptive_compartment_validation
    biological_unit: animal
    hemisphere_handling: equal_valid_hemispheres_plus_paired_concordance
    primary_source: results/source_data/03_qc_exploration/04e_control_compartment_abundance_publication_figures/global/figure2d_compact_marker_enrichment_differences_v2_source_data.csv
    input_dependencies:
      - results/tables/11_spatial_systems/bilateral/bilateral_empirical_compartment_summary.csv
    required_columns: [marker_class, ProteinGroupID, intended_dataset, intended_minus_comparator_log2]
    overlaps_existing_panel: "2d"
    likely_role: candidate_replacement
    caveat: >-
      A candidate alternative to canonical 2d. Canonical 2d is unchanged and
      remains the manuscript panel.


contract_version: manuscript_figures_v3_final_truth_v9_promoted

figures:
  "01":
    title: Figure 1
    canonical_publication_id: figure_01
    width_mm: 183
    height_mm: 180
    manuscript_role: primary_behavioural_figure
    is_numbered_manuscript_figure: true
    analysis_repository: topohl/MMMSociability
    analysis_frozen_at: 30a2666198ca6f23795773da1b7d0ef34e78ac37
    source_data_frozen_in: manuscript/figure1_bridge_mmmsociability/source_data
    rendering_repository_computes_statistics: false
    visual_lineage: >-
      Descends from the original behaviour main figure, whose closest surviving
      ancestor is MMMSociability Analysis/27_candidate_recompose_behavior_main_figure.R
      at commit 4b0f90f. The held-out prediction panel with its permutation null,
      the dashed identity line, the circle/triangle sex encoding and the point and
      histogram marks are recovered from it. The original's timeline schematic and
      its six-component forest have no source in MMMSociability, SISanalyzer or this
      repository at any commit; the timeline is therefore authored in that visual
      language and the forest is deliberately not reproduced.
    scientific_contract_summary: >-
      Early spontaneous home-cage activity prospectively predicts later composite
      stress outcome. The biological unit is the animal throughout. The early
      predictor window closes before every component of the outcome is measured,
      so the classification did not exist at the time of recording. The prediction
      target is continuous CombZ, never the binary resilient/susceptible label, and
      the validation is internal out-of-sample, never independent or external. All
      statistics are computed in the behavioural repository and frozen; this
      repository renders them and computes nothing.
    rejected_from_original: >-
      The six-component forest, because those components construct CombZ and their
      group separation is true by construction. The sex-split movement scatters,
      because the formal feature-by-sex interaction is unsupported at all q = 0.90
      and the original's rho of -0.38 and -0.43 come from a quarantined legacy run
      that no longer reproduces. The movement trajectory panel, because it rests on
      GAMM curves whose group contrasts are all BH-null. The p-value brackets over
      CON/RES/SUS, because that comparison is definitional.
    panels:
      - id: 1a
        description: Experimental timeline and the temporal ordering of predictor and outcome
        producer_script: figures/figure_01_panels.R
        render_mode: copy_svg
        source_data_mode: copy_csv
        figure_source: results/figures/manuscript/figure_01_panels/figure_01a.svg
        primary_source: manuscript/figure1_bridge_mmmsociability/source_data/figure1a_timeline_source.csv
        input_dependencies:
          - manuscript/figure1_bridge_mmmsociability/source_data/figure1a_timeline_source.csv
          - manuscript/figure1_bridge_mmmsociability/source_data/figure1_panel_statistics.csv
        required_columns: [figure_panel, step, event, age_or_time, precedes_outcome, used_as_predictor, used_in_outcome]
        expected_rows: 7
        scientific_contract: design_schematic_temporal_precedence
        biological_unit: AnimalID
        hemisphere_handling: not_applicable_behavioural
        analysis_repository: topohl/MMMSociability
        rendering_repository_computes_statistics: false
        row: 1
        col: 1
        colspan: 2
      - id: 1b
        description: Later composite outcome and the same-sex control-referenced classification rule
        producer_script: figures/figure_01_panels.R
        render_mode: copy_svg
        source_data_mode: copy_csv
        figure_source: results/figures/manuscript/figure_01_panels/figure_01b.svg
        primary_source: manuscript/figure1_bridge_mmmsociability/source_data/figure1b_combz_classification_source.csv
        input_dependencies:
          - manuscript/figure1_bridge_mmmsociability/source_data/figure1b_combz_classification_source.csv
          - manuscript/figure1_bridge_mmmsociability/source_data/figure1_panel_statistics.csv
        required_columns: [figure_panel, AnimalID, Sex, CombZ, final_group, control_reference_mean, control_reference_population_sd, susceptibility_threshold]
        expected_rows: 117
        scientific_contract: phenotype_definition_not_independent_validation
        biological_unit: AnimalID
        hemisphere_handling: not_applicable_behavioural
        analysis_repository: topohl/MMMSociability
        rendering_repository_computes_statistics: false
        circularity_note: >-
          The six components that build CombZ are absent from the source data, so
          they cannot be plotted. No brackets, no stars. The subtitle states that
          the threshold defines these groups rather than testing them.
        row: 2
        col: 1
      - id: 1c
        description: Early mean movement versus later composite outcome
        producer_script: figures/figure_01_panels.R
        render_mode: copy_svg
        source_data_mode: copy_csv
        figure_source: results/figures/manuscript/figure_01_panels/figure_01c.svg
        primary_source: manuscript/figure1_bridge_mmmsociability/source_data/figure1c_movement_combz_source.csv
        input_dependencies:
          - manuscript/figure1_bridge_mmmsociability/source_data/figure1c_movement_combz_source.csv
          - manuscript/figure1_bridge_mmmsociability/source_data/figure1_panel_statistics.csv
        required_columns: [figure_panel, AnimalID, Sex, Group, Movement_mean, CombZ]
        expected_rows: 111
        scientific_contract: primary_association_spearman_no_model_fitted
        biological_unit: AnimalID
        hemisphere_handling: not_applicable_behavioural
        analysis_repository: topohl/MMMSociability
        rendering_repository_computes_statistics: false
        statistic: Spearman rank correlation with 5000-sample percentile bootstrap CI, BH over three prespecified features
        stratification: none; the formal feature-by-sex interaction is unsupported
        colour_encoding: >-
          Single colour, deliberately. Susceptible animals sit low on this y axis and
          resilient animals high by construction, because the axis is the score the
          groups were cut from, so colouring by group would invite reading the
          correlation as group separation.
        row: 2
        col: 2
      - id: 1d
        description: Held-out prediction of later composite outcome with its full-refit permutation null
        producer_script: figures/figure_01_panels.R
        render_mode: copy_svg
        source_data_mode: copy_csv
        figure_source: results/figures/manuscript/figure_01_panels/figure_01d.svg
        primary_source: manuscript/figure1_bridge_mmmsociability/source_data/figure1d_loao_predictions_source.csv
        input_dependencies:
          - manuscript/figure1_bridge_mmmsociability/source_data/figure1d_loao_predictions_source.csv
          - manuscript/figure1_bridge_mmmsociability/source_data/figure1_panel_statistics.csv
        required_columns: [figure_panel, AnimalID, Sex, Group, observed_CombZ, predicted_CombZ, model_id, validation_scheme]
        expected_rows: 111
        scientific_contract: held_out_prediction_continuous_target_internal_validation
        biological_unit: AnimalID
        hemisphere_handling: not_applicable_behavioural
        analysis_repository: topohl/MMMSociability
        rendering_repository_computes_statistics: false
        model: movement_mean; sole predictor Movement_mean; uses_group FALSE
        prediction_target: continuous CombZ, never the binary phenotype
        composite_panel: >-
          Two sub-plots in one panel, as the original presented them: the
          observed-versus-predicted scatter with a dashed identity line at true 45
          degrees, and beside it the 1000 full-refit permutation draws with the
          observed value marked. The permutation source is
          figure1e_permutation_source.csv and the repeated grouped five-fold
          summary is figure1f_repeated_cv_source.csv; both are declared as
          additional dependencies below.
        additional_source_data:
          - manuscript/figure1_bridge_mmmsociability/source_data/figure1e_permutation_source.csv
          - manuscript/figure1_bridge_mmmsociability/source_data/figure1f_repeated_cv_source.csv
        row: 3
        col: 1
        colspan: 2
  # PROMOTED IN PHASE 5B. Figures 2 and 3 are the final_truth_v9 generation.
  # The evidence decision was made in the Phase 5 adjudication: of thirteen
  # Results 2/3 claims, seven are supported by both generations, six by v9
  # alone and none by the retired grid generation, which had no bilateral
  # panel, no QC-aware DAP track and no GSEA exemplar curves. The three
  # technical blockers that held promotion back - column misregistration
  # between the DAP track and the atlas, a dependency on the superseded
  # export namespace, and a hard-coded eps-floor legend constant - were
  # repaired first and are guarded by tests.
  #
  # These entries copy panels the v9 entry points render, exactly as Figure 1
  # copies its panels: this layer validates, hashes, re-publishes the source
  # data and assembles. It computes nothing.


  - name: ED4_WGCNA_SPATIAL
    figure_key: extended_data
    width_mm: 183
    height_mm: 168
    question: How are WGCNA modules actually organised in space?
    layout:
      - {panel: v6_ed_module_fingerprint, label: a, x: 4,  "y": 4,   w: 175, h: 96}
      - {panel: v6_ed_wgcna_circle,       label: b, x: 4,  "y": 106, w: 88,  h: 58}
      - {panel: v6_ed_celltype,           label: c, x: 96, "y": 106, w: 83,  h: 58}

  - name: ED5_WGCNA_PHENOTYPE
    figure_key: extended_data
    width_mm: 183
    height_mm: 100
    question: Broad directional coherence is descriptive; individual module phenotype effects are not FDR-supported.
    layout:
      - {panel: v6_ed_wgcna_phenotype, label: a, x: 4, "y": 4, w: 175, h: 92}

  - name: ED6_GSEA_SUPPORT
    figure_key: extended_data
    width_mm: 183
    height_mm: 168
    question: The complete three-contrast enrichment context behind the three highlighted programs.
    layout:
      - {panel: v6_ed_atlas_rescon,    label: a, x: 4, "y": 4,   w: 175, h: 52}
      - {panel: v6_ed_atlas_suscon,    label: b, x: 4, "y": 60,  w: 175, h: 52}
      - {panel: v6_ed_gsea_curve_syn,  label: c, x: 4, "y": 116, w: 57,  h: 48}
      - {panel: v6_ed_gsea_curve_rna,  label: d, x: 65, "y": 116, w: 57, h: 48}
      - {panel: v6_ed_gsea_curve_ox,   label: e, x: 126, "y": 116, w: 53, h: 48}

  - name: ED7_STRESS_IDENTITY
    figure_key: extended_data
    width_mm: 183
    height_mm: 168
    question: >-
      Does the strongest stress-associated effect occur where the protein is
      most abundant at baseline?
    layout:

# Story-v5: Figure-2 spatial-validation redesign + the Extended Data family.
#
# Canonical, Part-16, Part-17, Part-18 and Part-19 are all frozen. Outputs live
# under results/**/manuscript_candidates/story_v5/**. Figure 3 is NOT redesigned
# in this layer.

contract_version: manuscript_story_v5_figures_v1
status: candidate_only_not_promoted
palette: config/manuscript_palette.yml

panels:

  # ---- reused unchanged from earlier layers ------------------------------
  - id: v5_schematic
    renderer: s4_schematic
    role: experimental_anatomy_anchor
    narrative: orients the reader in hippocampal anatomy and the sampling design.
    primary_source: null
  - id: v5_depth
    renderer: nvp_depth_compact
    role: technical_context
    narrative: confirms the measurement is deep enough in every compartment.
    primary_source: results/source_data/manuscript/figure_02/figure_02b_source_data.csv
  - id: v5_pca
    renderer: s5_pca
    role: global_structure
    narrative: shows the proteomes occupy structured molecular spaces before any stress model.
    primary_source: results/source_data/manuscript/figure_02/figure_02c_source_data.csv
    input_dependencies:
      - results/tables/03_qc_exploration/00b_joint_compartment_qc/global/joint_primary_pca_variance_explained.csv
  - id: v5_bilateral
    renderer: s4_bilateral
    role: reproducibility
    narrative: >-
      tests reproducibility across paired hemispheres over every prespecified
      contrast, showing coarse regional identities reproduce strongly and fine
      CA1 laminar identities less so.
    primary_source: results/tables/11_spatial_systems/bilateral/bilateral_spatial_identity_protein_level.csv
    input_dependencies:
      - results/tables/11_spatial_systems/bilateral/bilateral_spatial_identity_summary.csv
  - id: v5_precision
    renderer: svp_precision_dumbbell
    role: measurement_quality
    narrative: quantifies the reliability gained by averaging hemispheres.
    primary_source: results/tables/11_spatial_systems/precision/bilateral_precision_gain.csv
  - id: v5_compartment
    renderer: s4_compartment
    role: compartment_identity
    narrative: ten named canonical markers carry the expected compartment pattern.
    primary_source: results/source_data/03_qc_exploration/04e_control_compartment_abundance_publication_figures/global/figure2d_compact_recognizable_markers_v2_source_data.csv

  # ---- REDESIGNED 2f and 2g ---------------------------------------------
  - id: v5_kaulich
    renderer: s5_kaulich_forest
    role: external_validation
    narrative: >-
      asks whether prespecified internal anatomical contrasts recover the
      corresponding external hippocampal signatures, plotted as a hierarchical
      forest because the contrast-by-signature matrix is block-diagonal and
      52 per cent of it is structurally meaningless.
    primary_source: results/source_data/04_differential_expression_enrichment/control_spatial_identity_validation/global/figure2e_source_data.csv
  - id: v5_internal
    renderer: s5_internal_multiples
    role: internal_validation
    narrative: >-
      shows the internal functional counterpart: each anatomical contrast
      recovers its own canonical programs, as contrast-centric small multiples
      because the term set is contrast-specific and a shared term axis would be
      83 per cent blank.
    primary_source: results/source_data/04_differential_expression_enrichment/control_spatial_identity_validation/global/figure2f_regions_CA1layers_source_data.csv

  # ---- Extended Data ------------------------------------------------------
  - id: v5_ed_wgcna_circle
    renderer: svp_wgcna_circle
    role: wgcna_structure
    narrative: module structure at a readable size, encoding no phenotype significance.
    primary_source: results/tables/11_spatial_systems/atlas/WGCNA_module_spatial_cell_affinity.csv
  - id: v5_ed_wgcna_strip
    renderer: svp_wgcna_strip
    role: wgcna_structure_exact
    narrative: the same structure as exact per-module values.
    primary_source: results/tables/11_spatial_systems/atlas/WGCNA_module_spatial_cell_affinity.csv
  - id: v5_ed_celltype
    renderer: nvp_ed_celltype
    role: wgcna_celltype
    narrative: external cell-type affinity per compartment.
    primary_source: results/tables/11_spatial_systems/atlas/WGCNA_module_spatial_cell_affinity.csv
  - id: v5_ed_wgcna_phenotype
    renderer: s5_ed_wgcna_phenotype
    role: wgcna_phenotype_context
    narrative: >-
      the full 15-module three-contrast effect field, with the null stated on
      the panel: no module x contrast cell reaches tier-specific FDR.
    primary_source: results/source_data/manuscript_panels/figure_3/figure3b_stage07_effect_source.csv
  - id: v5_ed_missing
    renderer: s5_ed_ca2_missingness
    role: ca2_qc
    narrative: pre-imputation missingness per CA2-SLM sample with QC flags.
    primary_source: results/tables/11_spatial_systems/ca2_slm_robustness/CA2_SLM_sample_context.csv
  - id: v5_ed_displacement
    renderer: s5_ed_ca2_displacement
    role: ca2_qc
    narrative: >-
      the mechanism: missingness inflates a sample's observed median, and
      centring then displaces every protein in it downwards.
    primary_source: results/tables/11_spatial_systems/ca2_slm_robustness/CA2_SLM_normalization_bias_context.csv
  - id: v5_ed_classes
    renderer: s5_ed_ca2_classes
    role: ca2_qc
    narrative: the 28 canonical hits split into 6 robust, 10 not claimable, 12 unevaluable.
    primary_source: results/tables/11_spatial_systems/ca2_slm_robustness/CA2_SLM_DAP_robustness.csv
  - id: v5_ed_sensitivity
    renderer: s5_ed_ca2_sensitivity
    role: ca2_qc
    narrative: canonical effect versus the effect with QC-failed hemispheres dropped.
    primary_source: results/tables/11_spatial_systems/ca2_slm_robustness/CA2_SLM_DAP_robustness.csv
  - id: v5_ed_identity
    renderer: s5_ed_identity_subsets
    role: stress_identity
    narrative: the outside-baseline-affinity result across every robustness subset.
    primary_source: results/tables/11_spatial_systems/ca2_slm_robustness/stress_identity_robustness_comparison.csv
  - id: v5_ed_nulls
    renderer: s5_ed_nulls
    role: network_null
    narrative: the exact whole-network permutation result, shown against its attainable floor.
    primary_source: results/tables/11_spatial_systems/networks/network_global_multivariate_test.csv

  - id: v5_ed_gsea_curve_syn
    renderer: s4_gsea_curve
    role: gsea_support
    program_key: synaptic
    narrative: >-
      the running enrichment score behind the neuropil synaptic program,
      reconstructed exactly from the stored ranking rather than redrawn.
    primary_source: null
    input_dependencies:
      - results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv
  - id: v5_ed_gsea_curve_rna
    renderer: s4_gsea_curve
    role: gsea_support
    program_key: rna
    narrative: the same reconstruction for the soma mRNA-processing program.
    primary_source: null
    input_dependencies:
      - results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv
  - id: v5_ed_gsea_curve_ox
    renderer: s4_gsea_curve
    role: gsea_support
    program_key: oxphos
    narrative: the same reconstruction for the microglial oxidative-phosphorylation program.
    primary_source: null
    input_dependencies:
      - results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv
  - id: v5_ed_gsea_atlas
    renderer: nvp_gsea_atlas
    role: gsea_support
    narrative: >-
      where those three programs sit in the complete SUS-RES enrichment atlas,
      so the reader can see the selected curves in context.
    primary_source: results/tables/10_biological_integration/gsea_wgcna_concordance/global/ontology_aware_gsea_theme_assignments_all_contrasts.csv
  - id: v5_ed_network_distance
    renderer: s5_ed_network_distance
    role: network_replicates
    narrative: >-
      animal-level network distance from the CON consensus, one point per
      independent network replicate.
    primary_source: results/tables/11_spatial_systems/networks/animal_network_distance_from_CON.csv
  - id: v5_ed_coupling
    renderer: s5_ed_coupling
    role: coupling_null
    narrative: >-
      every distinct edge-behaviour correlation with its interval, showing that
      the coupling analysis is an underpowered null and not a hit list.
    primary_source: results/tables/08_behavior_physio_coupling/network_behavior_coupling/edge_behavior_correlations_fdr_all_tests.csv


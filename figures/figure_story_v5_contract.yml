  - name: ED1_TECHNICAL_BILATERAL
    figure_key: extended_data
    width_mm: 183
    height_mm: 150
    question: Bilateral sampling produces reproducible spatial identities and improves animal-level precision.
    layout:
      - {panel: v5_bilateral, label: a, x: 4, "y": 4,  w: 175, h: 76}
      - {panel: v5_precision, label: b, x: 4, "y": 86, w: 88,  h: 58}

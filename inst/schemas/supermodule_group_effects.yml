columns:
  dataset: {type: character, allowed_values: [neuron_neuropil, neuron_soma, microglia]}
  level: {type: character, allowed_values: [supermodule]}
  supermodule_id: {type: character}
  contrast: {type: character}
  estimate: {type: numeric}
  p_value: {type: numeric, range: {min: 0, max: 1}}
  analysis_tier: {type: character, allowed_values: [primary_wgcna_global, secondary_contextual_global, secondary_spatial_heterogeneity, exploratory_spatial_localization]}
  hypothesis_level: {type: character, allowed_values: [higher_order_multimodule, compatibility_alias]}
  primary_contrast: {type: logical}
  model_valid_for_inference: {type: logical}
  model_diagnostic_scope: {type: character, allowed_values: [single_fitted_model, composite_reduced_full, full_interaction_model]}
  model_stability_status: {type: character, allowed_values: [stable_mixed_model, boundary_random_intercept_zero, stable_animal_level_lm]}
  independent_hypothesis: {type: logical}
  enters_primary_fdr: {type: logical}
  statistical_support_status: {type: character, allowed_values: [FDR_supported, suggestive_FDR10, nominal_exploratory, not_supported, inherited_from_canonical_entity]}
  support_source_entity_id: {type: character}
  canonical_claim_entity_id: {type: character}
  manuscript_claim_ready: {type: character, allowed_values: [not_assessed_stage05]}
  FDR_primary_global: {type: numeric, range: {min: 0, max: 1}}
  FDR_secondary_global: {type: numeric, range: {min: 0, max: 1}}
  FDR_interaction_omnibus: {type: numeric, range: {min: 0, max: 1}}
  FDR_local_exploratory: {type: numeric, range: {min: 0, max: 1}}
  FDR_conservative_all_tests: {type: numeric, range: {min: 0, max: 1}}
  FDR_global: {type: numeric, range: {min: 0, max: 1}}
  model_family: {type: character}
  model_formula: {type: character}
  primary_model_stable: {type: logical}
  claim_allowed_model: {type: logical}
  model_downgrade_reason: {type: character}
  fallback_used: {type: logical}
  fallback_type: {type: character}
  rank_deficient_model: {type: logical}
  singular_model: {type: logical}
  variance_ratio: {type: numeric}
  ICC: {type: numeric, range: {min: 0, max: 1}}
  is_singular_lme4: {type: logical}
  boundary_by_variance_ratio: {type: logical}
  boundary_variance_ratio_tolerance: {type: numeric}
  lme4_singularity_tolerance: {type: numeric}
  singularity_diagnostic_status: {type: character, allowed_values: [concordant_boundary, concordant_nonboundary, variance_ratio_boundary_only, lme4_singular_only, not_applicable_lm]}
  diagnostic_review_required: {type: logical}
  singularity_class: {type: character, allowed_values: [stable_single_animal_intercept, boundary_single_animal_intercept, not_applicable_lm, composite_reduced_full_stable, composite_reduced_full_boundary, composite_reduced_full_diagnostic_review]}
  reduced_formula: {type: character}
  reduced_row_hash: {type: character}
  reduced_fixed_effect_rank: {type: integer}
  reduced_fixed_effect_columns: {type: integer}
  reduced_optimizer_code: {type: any}
  reduced_optimizer_messages: {type: character}
  reduced_convergence_status: {type: character}
  reduced_convergence_warnings: {type: character}
  reduced_random_effect_structure: {type: character}
  reduced_random_intercept_variance: {type: numeric}
  reduced_residual_variance: {type: numeric}
  reduced_variance_ratio: {type: numeric}
  reduced_ICC: {type: numeric, range: {min: 0, max: 1}}
  reduced_is_singular_lme4: {type: logical}
  reduced_boundary_by_variance_ratio: {type: logical}
  reduced_singularity_class: {type: character}
  reduced_model_stability_status: {type: character}
  reduced_diagnostic_review_required: {type: logical}
  full_formula: {type: character}
  full_row_hash: {type: character}
  full_fixed_effect_rank: {type: integer}
  full_fixed_effect_columns: {type: integer}
  full_optimizer_code: {type: any}
  full_optimizer_messages: {type: character}
  full_convergence_status: {type: character}
  full_convergence_warnings: {type: character}
  full_random_effect_structure: {type: character}
  full_random_intercept_variance: {type: numeric}
  full_residual_variance: {type: numeric}
  full_variance_ratio: {type: numeric}
  full_ICC: {type: numeric, range: {min: 0, max: 1}}
  full_is_singular_lme4: {type: logical}
  full_boundary_by_variance_ratio: {type: logical}
  full_singularity_class: {type: character}
  full_model_stability_status: {type: character}
  full_diagnostic_review_required: {type: logical}
  emmeans_success: {type: logical}
  animal_random_effect_used: {type: logical}
  biological_replicate_unit: {type: character}
  n_animals_total: {type: integer}
  n_animals_per_group: {type: character}
  min_animals_per_group: {type: integer}
  n_samples_total: {type: integer}
  n_samples_per_group: {type: character}
  animal_level_status: {type: character, allowed_values: [animal_level, repeated_animal_spatial_unit_mixed_model]}
  pseudoreplication_guard: {type: character}

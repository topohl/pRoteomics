# Publication source-data contract.
#
# The scientific repository owns this list: which publication identities it
# exports source data for, and which analysis originates each one. It does
# NOT own how a journal figure is assembled from that data.
#
# This file exists so that building the bundle never requires reading the
# manuscript repository. The two repositories are coupled only through the
# frozen bundle and its manifest, in that direction.
#
# Identities are stable publication names. Historical renderer generations
# (final_truth_v9, spatial_v6, ED1_FINAL_V9) live in manuscript provenance,
# never here.

contract_version: publication_source_data_v1

identities:
  - publication_id: extended_data_01
    source_data_dir: results/source_data/manuscript/extended_data_01
    originating_analysis: "this repository"
    upstream_source_commit: "n/a"

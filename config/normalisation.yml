# PRIMARY PROTEOMICS TREE OF THE PAPER (Analysis/proteomics_rerun_332, branch design-332-search2-2026-11-13): the
# facility's second DIA-NN search, delivered 2026-11-13 without A764, eight animals (3 CON, 3 RES, 2 SUS), re-imputed on
# the eight animals. The nine-animal tree on the first search (Analysis/proteomics_original) is the earlier analysis.
#
# Per-sample centring applied by archive/01_preprocessing/01_impute.r after log2 and before the 70% missingness
# filter and the down-shift imputation. This is the only setting that separates the two analysis versions: every
# downstream matrix, model, enrichment, network and figure inherits it through the imputed workbooks. (The joint
# compartment QC keeps its own fixed shared-core median and is not affected.)
#
#   all_observed_median    median of all observed values of the sample: the PRIMARY analysis (this tree)
#   complete_case_median   median of the proteins quantified in every sample of the compartment: the SENSITIVITY
#                          analysis, for the same eight animals in Analysis/proteomics_rerun_332_complete_case
#                          (branch design-332-search2-cc-2026-11-18)
#
# The impute step stamps the version it wrote (data/processed/01_preprocessing/impute/normalisation_stamp.yml). The
# pipeline launcher refuses to run when this setting and the stamp disagree, when the newest metadata-joined workbook
# does not carry the name of a stamped workbook (a name check), or when the animal-level input or the limma fit trace
# to another imputed workbook (recorded hashes); every run manifest records the setting and the stamp. Regenerating a
# directory that holds another version is refused until that version is preserved and listed in
# config/normalisation_versions.yml. PROTEOMICS_SAMPLE_CENTRING overrides this file for an ad-hoc run into a separate
# output directory; it never satisfies an approval.
#
# The export bundle in this tree (exports/, results/manuscript, pride_submission) has not been rebuilt for the
# eight-animal analysis yet (it holds a manifest copied from the nine-animal tree); it is rebuilt only by the export
# stage, which runs only in a tree whose active setting is the approved one.
#
# decision: pending | approved. Approval names one centring in approved_sample_centring; freeze, export and deposit
# (this repository) run only when decision is approved and approved_sample_centring equals sample_centring set in this
# file.
#
# DECISIONS (Tobias): 2026-10-26, the original centring (all_observed_median) is the primary analysis and the
# complete-case centring (complete_case_median) its sensitivity analysis; 2026-11-18, this eight-animal tree is the
# paper's proteomics; 2026-11-21, approved with the original centring. Module labels are still provisional; the export
# is rerun after they are reviewed.
sample_centring: all_observed_median
decision: approved
approved_sample_centring: all_observed_median

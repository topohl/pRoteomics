version: 2
description: "Canonical active proteomics pipeline registry. This file is the source of truth for runnable stages, script order, dataset support, inputs, outputs, and safe-rerun status."
datasets:
  - neuron_neuropil
  - neuron_soma
  - microglia
stages:
  core:
    description: "Core dataset handoff: split upstream contrast files, prepare module-score metadata, and map protein identifiers for downstream analyses."
    scripts:
      - script: "analysis/preprocessing/extract_protigy_contrasts.R"
        required: true
        datasets: ["neuron_neuropil", "neuron_soma", "microglia"]
        stage: "core"
        scope: "dataset_specific"
        produces: ["results/preprocessing/extract_protigy_contrasts/<dataset>/tables/forward/*.csv", "results/preprocessing/extract_protigy_contrasts/<dataset>/tables/reverse/*.csv", "results/preprocessing/extract_protigy_contrasts/<dataset>/manifests/indexComparisons.csv", "results/preprocessing/extract_protigy_contrasts/<dataset>/manifests/canonical_gct_extract_manifest.csv"]
        consumes_required: ["data/processed/01_preprocessing/protigy_output/<dataset>/*.gct"]
        consumes_optional: ["data/processed/01_preprocessing/protigy_output/<dataset>/protigy_manifest.csv", "data/processed/01_preprocessing/protigy_output/protigy_manifest.csv"]
        recomputes_core_state: true
        safe_downstream_rerun: false
        notes: "Creates dataset-scoped GCT comparison CSVs consumed by MapThatProt; rerun intentionally because this refreshes core handoff state."
      - script: "analysis/preprocessing/build_module_score_metadata.R"
        required: false
        datasets: ["neuron_neuropil", "neuron_soma", "microglia"]
        stage: "core"
        scope: "dataset_specific"
        produces: ["results/preprocessing/build_module_score_metadata/<dataset>/tables/sample_metadata_merged_clean_for_module_scores.xlsx", "results/preprocessing/build_module_score_metadata/<dataset>/tables/metadata_merge_qc_summary.csv", "results/preprocessing/build_module_score_metadata/<dataset>/manifests/run_manifest.yml", "results/preprocessing/build_module_score_metadata/<dataset>/reports/metadata_merge_summary.md"]
        consumes_required: ["data/processed/01_preprocessing/**/*.xlsx"]
        consumes_optional: ["data/external/behavior/auc_individual_animals_all.csv", "data/external/behavior/auc_individual_animals_firstChangeActive.csv", "data/external/behavior/E9_Behavior_Data.xlsx"]
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "Builds dataset-scoped behavior/physiology metadata used by module activity scoring; does not change expression matrices."
      - script: "analysis/preprocessing/map_protein_identifiers.R"
        required: true
        datasets: ["neuron_neuropil", "neuron_soma", "microglia"]
        stage: "core"
        scope: "dataset_specific"
        produces: ["results/preprocessing/map_protein_identifiers/<dataset>/tables/mapped/forward/per_file/*.csv", "results/preprocessing/map_protein_identifiers/<dataset>/tables/mapped/forward/summaries/*.csv"]
        consumes_required: ["results/preprocessing/extract_protigy_contrasts/<dataset>/tables/forward/*.csv", "data/processed/01_preprocessing/gct_extractR/<dataset>/forward/*.csv", "data/external/MOUSE_10090_idmapping.dat"]
        consumes_optional: ["data/metadata/manual_mapping.xlsx"]
        recomputes_core_state: true
        safe_downstream_rerun: false
        notes: "Maps GCT-derived protein IDs to UniProt/gene symbols; enrichment and WGCNA consume these mapped files."
  joint_qc_preprocessing:
    description: "Raw-derived global joint compartment preprocessing for QC and a single ProTIGY input; it does not alter dataset-specific analysis contracts."
    scripts:
      - script: "analysis/preprocessing/build_joint_protigy_input.R"
        required: false
        datasets: ["global"]
        stage: "joint_qc_preprocessing"
        scope: "global"
        produces: ["results/preprocessing/build_joint_protigy_input/global/models/joint_compartment_qc_matrices.rds", "results/preprocessing/build_joint_protigy_input/global/tables/feature_filter_audit.csv", "results/preprocessing/build_joint_protigy_input/global/models/joint_shared_core_log2_median_normalized_imputed.gct", "results/preprocessing/build_joint_protigy_input/global/manifests/run_manifest.yml"]
        consumes_required: ["data/raw/pg_matrix/quicksearch.pg_matrix.tsv", "data/metadata/TPE9_sample_metadata_males.xlsx", "data/external/MOUSE_10090_idmapping.dat"]
        consumes_optional: ["data/metadata/manual_mapping.xlsx", "data/metadata/manual_gene_annotation_overrides.csv"]
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "Balanced dataset-by-technical-block shared core, joint log2/sample-median normalization, label-blind protein-wise median imputation, and strict GCT v1.3 export for global QC only."
  qc_global:
    description: "Global QC and marker/reference setup across dataset families."
    scripts:
      - script: "analysis/qc/assess_joint_compartment_quality.R"
        required: false
        datasets: ["global"]
        stage: "qc_global"
        scope: "global"
        produces: ["results/qc/assess_joint_compartment_quality/global/tables", "results/qc/assess_joint_compartment_quality/global/plots", "results/qc/assess_joint_compartment_quality/global/reports/joint_compartment_qc_summary.md", "results/qc/assess_joint_compartment_quality/global/manifests/run_manifest.yml"]
        consumes_required: ["results/preprocessing/build_joint_protigy_input/global/models/joint_compartment_qc_matrices.rds", "data/processed/01_preprocessing/joint_compartment_qc/global/joint_compartment_qc_matrices.rds"]
        consumes_optional: []
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "Uncorrected global PCA plus exploratory UMAP/t-SNE from the raw-derived primary shared core; does not perform combined DE/WGCNA or primary batch correction."
      - script: "analysis/qc/render_joint_compartment_qc_figures.R"
        required: false
        datasets: ["global"]
        stage: "qc_global_publication_figures"
        scope: "global"
        produces: ["results/qc/render_joint_compartment_qc_figures/global/plots/publication_style/joint_compartment_qc_main_figure_183mm.svg", "results/qc/render_joint_compartment_qc_figures/global/plots/publication_style/joint_compartment_qc_extended_data_figure_183mm.svg", "results/qc/render_joint_compartment_qc_figures/global/plots/publication_style/panels", "results/qc/render_joint_compartment_qc_figures/global/reports/joint_compartment_qc_publication_figure_manifest.md", "results/qc/render_joint_compartment_qc_figures/global/manifests/run_manifest.yml"]
        consumes_required: ["results/preprocessing/build_joint_protigy_input/global/models/joint_compartment_qc_matrices.rds", "data/processed/01_preprocessing/joint_compartment_qc/global/joint_compartment_qc_matrices.rds", "results/tables/03_qc_exploration/00b_joint_compartment_qc/global/joint_primary_pca_scores.csv", "results/tables/03_qc_exploration/00b_joint_compartment_qc/global/joint_primary_pca_variance_explained.csv", "results/tables/03_qc_exploration/00b_joint_compartment_qc/global/joint_umap_exploratory_scores.csv", "results/tables/03_qc_exploration/00b_joint_compartment_qc/global/joint_tsne_exploratory_scores.csv", "results/tables/03_qc_exploration/00b_joint_compartment_qc/global/joint_sample_correlations.csv", "results/tables/03_qc_exploration/00b_joint_compartment_qc/global/primary_vs_complete_case_pca_concordance.csv"]
        consumes_optional: []
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "Plot-only Nature-style rendering of completed joint-QC coordinates and audits; writes new editable SVGs without replacing source tables or recomputing PCA/UMAP/t-SNE."
      - script: "analysis/qc/build_reference_marker_registry.R"
        required: false
        datasets: ["global"]
        stage: "qc_global"
        scope: "global"
        produces: ["config/marker_panels/wgcna_reference_marker_sets.csv", "results/qc/build_reference_marker_registry/global/tables"]
        consumes_required: ["data/external/reference_markers/reference_marker_sources.yml"]
        consumes_optional: ["config/marker_panels/compartment_fidelity_marker_sets.csv", "data/external/reference_markers/go_mgi/raw/mgi.gaf.gz", "data/external/reference_markers/go_mgi/raw/go-basic.obo", "data/external/reference_markers/go_mgi/raw/HOM_MouseHumanSequence.rpt", "data/external/reference_markers/syngo/raw/"]
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "Creates the marker registry consumed by marker QC and WGCNA downstream annotation; offline/cached sources are preferred."
      - script: "analysis/qc/discover_empirical_roi_markers.R"
        required: false
        datasets: ["global"]
        stage: "qc_global"
        scope: "global"
        produces: ["results/qc/discover_empirical_roi_markers/global/tables/empirical_roi_marker_sets.csv"]
        consumes_required: ["data/processed/01_preprocessing/impute/*_pgmatrix_imputed_neuron_neuropil_*_missing70pct.xlsx", "data/processed/01_preprocessing/impute/*_pgmatrix_imputed_neuron_soma_*_missing70pct.xlsx", "data/processed/01_preprocessing/impute/*_pgmatrix_imputed_microglia_*_missing70pct.xlsx", "data/external/MOUSE_10090_idmapping.dat", "data/metadata/TPE9_sample_metadata_males.xlsx"]
        consumes_optional: ["data/metadata/manual_mapping.xlsx", "data/metadata/manual_gene_annotation_overrides.csv"]
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "Global because marker discovery compares all three dataset matrices; CON/RES/SUS contrasts should not define marker sets."
  qc:
    description: "Dataset QC: sample quality, missingness, replicate consistency, marker abundance, PCA/confounding, variance partitioning, and QC-to-biology summaries."
    scripts:
      - script: "analysis/qc/assess_dataset_quality.R"
        required: false
        datasets: ["neuron_neuropil", "neuron_soma", "microglia"]
        stage: "qc"
        scope: "dataset_specific"
        produces: ["results/qc/assess_dataset_quality/<dataset>/tables/dataset_qc_report.xlsx", "results/qc/assess_dataset_quality/<dataset>/reports/dataset_qc_summary.md"]
        consumes_required: ["results/preprocessing/map_protein_identifiers/<dataset>/tables/mapped/forward/per_file/*.csv", "data/processed/02_id_mapping/mapped/<dataset>/forward/per_file/*.csv"]
        consumes_optional: ["data/metadata/*.xlsx"]
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "Baseline dataset QC."
      - script: "analysis/qc/assess_sample_quality.R"
        required: false
        datasets: ["neuron_neuropil", "neuron_soma", "microglia"]
        stage: "qc"
        scope: "dataset_specific"
        produces: ["results/qc/assess_sample_quality/<dataset>/plots", "results/qc/assess_sample_quality/<dataset>/tables/qc_summary_tables.xlsx"]
        consumes_required: ["data/raw/pg_matrix/quicksearch.stats.annotated.xlsx"]
        consumes_optional: ["data/metadata/*.xlsx"]
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "Quicksearch sample-level QC."
      - script: "analysis/qc/summarize_missingness.R"
        required: false
        datasets: ["neuron_neuropil", "neuron_soma", "microglia"]
        stage: "qc"
        scope: "dataset_specific"
        produces: ["results/qc/summarize_missingness/<dataset>/tables/missingness_diagnostics.xlsx"]
        consumes_required: ["results/preprocessing/map_protein_identifiers/<dataset>/tables/mapped/forward/per_file/*.csv", "data/processed/02_id_mapping/mapped/<dataset>/forward/per_file/*.csv"]
        consumes_optional: ["data/metadata/*.xlsx"]
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "Missingness diagnostics."
      - script: "analysis/qc/assess_replicate_consistency.R"
        required: false
        datasets: ["neuron_neuropil", "neuron_soma", "microglia"]
        stage: "qc"
        scope: "dataset_specific"
        produces: ["results/qc/assess_replicate_consistency/<dataset>/tables/replicate_consistency.xlsx"]
        consumes_required: ["results/preprocessing/map_protein_identifiers/<dataset>/tables/mapped/forward/per_file/*.csv", "data/processed/02_id_mapping/mapped/<dataset>/forward/per_file/*.csv"]
        consumes_optional: ["data/metadata/*.xlsx"]
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "Replicate consistency diagnostics."
      - script: "analysis/qc/assess_marker_rank_abundance.R"
        required: false
        datasets: ["neuron_neuropil", "neuron_soma", "microglia"]
        stage: "qc"
        scope: "dataset_specific"
        produces: ["results/qc/assess_marker_rank_abundance/<dataset>/tables"]
        consumes_required: ["data/processed/01_preprocessing/impute/*_pgmatrix_imputed_<dataset>_*_missing70pct.xlsx", "data/external/MOUSE_10090_idmapping.dat", "data/metadata/TPE9_sample_metadata_males.xlsx", "config/marker_panels/wgcna_reference_marker_sets.csv"]
        consumes_optional: ["data/metadata/manual_mapping.xlsx", "data/metadata/manual_gene_annotation_overrides.csv"]
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "Marker abundance QC; benefits from qc_global marker registries."
      - script: "analysis/qc/summarize_marker_detectability.R"
        required: false
        datasets: ["neuron_neuropil", "neuron_soma", "microglia"]
        stage: "qc"
        scope: "dataset_specific"
        produces: ["results/qc/summarize_marker_detectability/<dataset>/tables"]
        consumes_required: ["data/processed/01_preprocessing/impute/*_pgmatrix_imputed_<dataset>_*_missing70pct.xlsx", "data/external/MOUSE_10090_idmapping.dat", "data/metadata/TPE9_sample_metadata_males.xlsx", "config/marker_panels/wgcna_reference_marker_sets.csv"]
        consumes_optional: ["data/metadata/manual_mapping.xlsx", "data/metadata/manual_gene_annotation_overrides.csv", "results/qc/discover_empirical_roi_markers/global/tables/empirical_roi_marker_sets.csv", "results/tables/03_qc_exploration/05_empirical_roi_marker_discovery/empirical_roi_marker_sets.csv", "results/wgcna/build_wgcna_modules/<dataset>/models/wgcna_final_model_state.rds", "data/processed/06_modules_WGCNA/01_WGCNA/<dataset>/wgcna_final_model_state.rds", "results/wgcna/build_wgcna_modules/<dataset>/tables/modules/", "results/tables/06_modules_WGCNA/01_WGCNA/<dataset>/modules/"]
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "Dataset-specific canonical marker mapping, post-filter/post-imputation processed-matrix availability, and WGCNA interpretation bridge. These nonmissing values are not raw detection and are not the authoritative cross-compartment abundance validation."
      - script: "analysis/qc/assess_pca_confounding.R"
        required: false
        datasets: ["neuron_neuropil", "neuron_soma", "microglia"]
        stage: "qc"
        scope: "dataset_specific"
        produces: ["results/qc/assess_pca_confounding/<dataset>/tables"]
        consumes_required: ["results/preprocessing/map_protein_identifiers/<dataset>/tables/mapped/forward/per_file/*.csv", "data/processed/02_id_mapping/mapped/<dataset>/forward/per_file/*.csv"]
        consumes_optional: ["data/metadata/*.xlsx"]
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "PCA and confounding QC."
      - script: "analysis/qc/partition_variance.R"
        required: false
        datasets: ["neuron_neuropil", "neuron_soma", "microglia"]
        stage: "qc"
        scope: "dataset_specific"
        produces: ["results/qc/partition_variance/<dataset>/tables", "results/qc/partition_variance/<dataset>/reports"]
        consumes_required: ["results/preprocessing/map_protein_identifiers/<dataset>/tables/mapped/forward/per_file/*.csv", "data/processed/02_id_mapping/mapped/<dataset>/forward/per_file/*.csv"]
        consumes_optional: ["data/metadata/*.xlsx"]
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "Variance partitioning; no WGCNA recomputation."
      - script: "analysis/qc/export_marker_traits.R"
        required: false
        datasets: ["neuron_neuropil", "neuron_soma", "microglia"]
        stage: "qc"
        scope: "dataset_specific"
        produces: ["results/qc/export_marker_traits/<dataset>/tables"]
        consumes_required: ["data/processed/01_preprocessing/impute/*_pgmatrix_imputed_<dataset>_*_missing70pct.xlsx", "data/external/MOUSE_10090_idmapping.dat", "data/metadata/TPE9_sample_metadata_males.xlsx", "config/marker_panels/wgcna_reference_marker_sets.csv"]
        consumes_optional: ["data/metadata/manual_mapping.xlsx", "data/metadata/manual_gene_annotation_overrides.csv", "results/qc/discover_empirical_roi_markers/global/tables/empirical_roi_marker_sets.csv", "results/tables/03_qc_exploration/05_empirical_roi_marker_discovery/empirical_roi_marker_sets.csv"]
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "Exports canonical ProteinGroupID/member-provenance marker traits for later WGCNA annotation without depending on completed WGCNA outputs."
      - script: "analysis/qc/summarize_qc_confounding.R"
        required: false
        datasets: ["neuron_neuropil", "neuron_soma", "microglia"]
        stage: "qc"
        scope: "dataset_specific"
        produces: ["results/qc/summarize_qc_confounding/<dataset>/reports"]
        consumes_required: ["results/qc/assess_pca_confounding/<dataset>/tables", "results/tables/03_qc_exploration/05_pca_confounding_qc/<dataset>/", "results/qc/partition_variance/<dataset>/tables", "results/tables/03_qc_exploration/06_variance_partitioning/<dataset>/"]
        consumes_optional: ["results/qc/assess_marker_rank_abundance/<dataset>/tables", "results/tables/03_qc_exploration/04_marker_rank_abundance_qc/<dataset>/"]
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "Summarizes QC biology/confounding evidence."
  qc_cross_dataset:
    description: "Cross-dataset QC summaries that require completed dataset-specific QC outputs."
    scripts:
      - script: "analysis/qc/render_compartment_abundance_figures.R"
        required: false
        datasets: ["global"]
        stage: "qc_cross_dataset"
        scope: "global"
        produces: ["results/qc/render_compartment_abundance_figures/global/tables/source_data", "results/qc/render_compartment_abundance_figures/global/plots", "results/qc/render_compartment_abundance_figures/global/reports"]
        consumes_required: ["results/preprocessing/build_joint_protigy_input/global/models/joint_compartment_qc_matrices.rds", "data/processed/01_preprocessing/joint_compartment_qc/global/joint_compartment_qc_matrices.rds", "config/marker_panels/wgcna_reference_marker_sets.csv"]
        consumes_optional: []
        recomputes_core_state: false
        safe_downstream_rerun: false
        notes: "Authoritative v2 CON-only marker abundance/detection validation. Reconstructs observed raw-positive log2 values with joint shared-core sample offsets, preserves hemisphere and animal hierarchy, removes shared-core membership from the primary marker gate, uses centered-log2 medians/subpanel balance, and writes separately named shared-core/robust-z sensitivities. Existing v1 and v2 outputs are overwrite-protected; render-only regeneration requires an explicit environment guard."
  enrichment:
    description: "Differential abundance interpretation: enrichment manifests, GO/GSEA comparisons, neuropil/reference annotations, targeted signatures, program summaries, external overlaps, and EWCE."
    scripts:
      - script: "analysis/differential_abundance/run_clusterprofiler_enrichment.R"
        required: true
        datasets: ["neuron_neuropil", "neuron_soma", "microglia"]
        stage: "enrichment"
        scope: "dataset_specific"
        produces: ["results/differential_abundance/run_clusterprofiler_enrichment/<dataset>/models/clusterProfiler_manifest.csv"]
        consumes_required: ["results/preprocessing/map_protein_identifiers/<dataset>/tables/mapped/forward/per_file/*.csv", "data/processed/02_id_mapping/mapped/<dataset>/forward/per_file/*.csv"]
        consumes_optional: ["data/external/MOUSE_10090_idmapping.dat"]
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "Creates the dataset-scoped clusterProfiler manifest consumed by compareGO and program summaries."
      - script: "analysis/differential_abundance/audit_gsea_protein_direction.R"
        required: false
        datasets: ["neuron_neuropil", "neuron_soma", "microglia"]
        stage: "enrichment"
        scope: "dataset_specific"
        produces: ["results/differential_abundance/audit_gsea_protein_direction/<dataset>/tables/<ontology>/gsea_term_direction_audit.csv", "results/differential_abundance/audit_gsea_protein_direction/<dataset>/tables/<ontology>/gsea_contrast_direction_summary.csv", "results/differential_abundance/audit_gsea_protein_direction/<dataset>/tables/<ontology>/ora_pooled_direction_warning.csv", "results/differential_abundance/audit_gsea_protein_direction/<dataset>/tables/<ontology>/input_status.csv", "results/differential_abundance/audit_gsea_protein_direction/<dataset>/manifests/<ontology>/run_manifest.yml"]
        consumes_required: ["results/differential_abundance/run_clusterprofiler_enrichment/<dataset>/models/clusterProfiler_manifest.csv", "data/processed/04_differential_expression_enrichment/clusterProfiler/<dataset>/clusterProfiler_manifest.csv", "results/preprocessing/map_protein_identifiers/<dataset>/tables/mapped/forward/per_file/*.csv", "data/processed/02_id_mapping/mapped/<dataset>/forward/per_file/*.csv"]
        consumes_optional: ["results/source_data/04_differential_expression_enrichment/clusterProfiler/<dataset>/"]
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "Optional read-only diagnostic audit of GSEA NES direction against leading/core protein log2fc direction; does not alter enrichment outputs."
      - script: "analysis/differential_abundance/compare_go_enrichment.R"
        required: true
        datasets: ["neuron_neuropil", "neuron_soma", "microglia"]
        stage: "enrichment"
        scope: "dataset_specific"
        produces: ["results/differential_abundance/compare_go_enrichment/<dataset>/models/compareGO_input_manifest.csv", "results/differential_abundance/compare_go_enrichment/<dataset>/tables"]
        consumes_required: ["results/differential_abundance/run_clusterprofiler_enrichment/<dataset>/models/clusterProfiler_manifest.csv", "data/processed/04_differential_expression_enrichment/clusterProfiler/<dataset>/clusterProfiler_manifest.csv"]
        consumes_optional: []
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "Consumes only the manifest-selected clusterProfiler outputs for this dataset."
      - script: "analysis/differential_abundance/annotate_neuropil_reference.R"
        required: false
        datasets: ["neuron_neuropil", "neuron_soma", "microglia"]
        stage: "enrichment"
        scope: "dataset_specific"
        produces: ["results/differential_abundance/annotate_neuropil_reference/<dataset>/tables"]
        consumes_required: ["results/differential_abundance/run_clusterprofiler_enrichment/<dataset>/models/clusterProfiler_manifest.csv", "data/processed/04_differential_expression_enrichment/clusterProfiler/<dataset>/clusterProfiler_manifest.csv", "results/differential_abundance/run_clusterprofiler_enrichment/neuron_neuropil/models/clusterProfiler_manifest.csv", "data/processed/04_differential_expression_enrichment/clusterProfiler/neuron_neuropil/clusterProfiler_manifest.csv"]
        consumes_optional: ["config/marker_panels/wgcna_reference_marker_sets.csv"]
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "Adds neuropil-reference annotation where supported; microglia uses this as context for ROI/local microenvironment interpretation, not subtraction."
      - script: "analysis/differential_abundance/test_microglia_targeted_signatures.R"
        required: false
        datasets: ["microglia"]
        stage: "enrichment"
        scope: "dataset_specific"
        produces: ["results/differential_abundance/test_microglia_targeted_signatures/microglia/tables"]
        consumes_required: ["results/differential_abundance/run_clusterprofiler_enrichment/microglia/models/clusterProfiler_manifest.csv", "data/processed/04_differential_expression_enrichment/clusterProfiler/microglia/clusterProfiler_manifest.csv"]
        consumes_optional: ["config/marker_panels/wgcna_reference_marker_sets.csv", "results/qc/discover_empirical_roi_markers/global/tables/empirical_roi_marker_sets.csv", "results/tables/03_qc_exploration/05_empirical_roi_marker_discovery/empirical_roi_marker_sets.csv", "data/processed/05_celltype_enrichment_EWCE/EWCE_E9/microglia/EWCE_results_full.rds"]
        recomputes_core_state: false
        safe_downstream_rerun: true

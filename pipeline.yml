        consumes_required: ["data/processed/01_preprocessing/protigy_input_animal_level/neuron_neuropil/neuron_neuropil_animal_level.gct", "data/raw/pg_matrix/quicksearch.pg_matrix.tsv", "results/preprocessing/map_protein_identifiers/neuron_neuropil/tables/mapped/forward/per_file/", "data/processed/02_id_mapping/mapped/neuron_neuropil/forward/per_file/", "config/manuscript_spatial_order.yml"]
        consumes_optional: []
        recomputes_core_state: false
        safe_downstream_rerun: true
        notes: "Separation screen for staining feasibility, complementary to the FDR screen. At three animals per group an FDR value is variance-dominated; what decides whether a difference is visible on tissue is effect size, consistency across animals and within-group tightness. Computes descriptive separation measures only - within-group SD, complete separation, Z-factor and SSMD - from the canonical animal-level values. No p-value is derived and no model is fitted. Reads the raw matrix solely to rebuild the missingness mask, because imputed cells are artificially tight and would otherwise inflate every variance-based score; only fully observed protein x unit cells enter the ranking."

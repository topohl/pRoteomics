name: Pipeline dry-run

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2

      - name: Install lightweight test dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::yaml
            any::testthat
            any::digest
            any::readr
            any::readxl
            any::dplyr
            any::tidyr
            any::stringr
            any::purrr
            any::tibble
            any::ggplot2
            any::svglite
            any::scales
            any::forcats
            any::broom
            any::openxlsx
            bioc::limma

      - name: Verify limma availability
        shell: Rscript {0}
        run: |
          cat("R version:\n")
          print(R.version.string)
      
          cat("\nLibrary paths:\n")
          print(.libPaths())
      
          stopifnot(requireNamespace("limma", quietly = TRUE))
      
          cat("\nlimma version: ")
          print(as.character(packageVersion("limma")))

      - name: Validate tests
        run: Rscript tests/testthat.R

      - name: List stages
        run: Rscript run_dataset_pipeline.R --list-stages

      - name: QC dry-run
        run: Rscript run_dataset_pipeline.R --dataset neuron_neuropil --stage qc --dry-run

      - name: Microglia enrichment dry-run
        run: Rscript run_dataset_pipeline.R --dataset microglia --stage enrichment --dry-run
